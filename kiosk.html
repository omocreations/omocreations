<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4da6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kiosk · OmoCreations Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #ff4da6; --primary-dark: #e6398c; --dark: #0f0f1a; --gray: #6b7280; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%); min-height: 100vh; padding: 15px; }
    .kiosk-container { max-width: 650px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { color: white; font-size: 1.5rem; font-family: 'Playfair Display', serif; }
    .header h1 span { color: var(--primary); }
    .header p { color: var(--gray); font-size: 0.8rem; margin-top: 5px; }
    .clock { text-align: center; margin-bottom: 12px; }
    .clock-time { font-size: 2.5rem; font-weight: 800; color: white; letter-spacing: 2px; }
    .clock-date { font-size: 0.85rem; color: var(--gray); }
    .mode-toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .mode-btn { padding: 12px 28px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; background: rgba(255,255,255,0.1); color: white; transition: all 0.2s; font-family: 'Poppins', sans-serif; }
    .mode-btn.active { background: var(--success); }
    .mode-btn.checkout.active { background: var(--warning); }
    .stats { display: flex; justify-content: space-around; margin-bottom: 12px; background: rgba(255,255,255,0.05); border-radius: 30px; padding: 10px; }
    .stat { text-align: center; } .stat-value { font-size: 1.3rem; font-weight: 700; color: white; } .stat-label { font-size: 0.6rem; color: var(--gray); text-transform: uppercase; }
    .camera-section { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 10px; margin-bottom: 12px; }
    .camera-container { border-radius: 12px; overflow: hidden; background: #000; position: relative; }
    #webcamVideo { width: 100%; height: auto; display: block; object-fit: cover; }
    #snapCanvas { display: none; }
    .camera-controls { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
    .camera-controls button { background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; font-family: 'Poppins', sans-serif; }
    .staff-section { background: white; border-radius: 16px; padding: 15px; max-height: 320px; overflow-y: auto; }
    .staff-section h3 { font-size: 0.95rem; margin-bottom: 12px; color: var(--dark); display: flex; align-items: center; gap: 8px; }
    .staff-table { width: 100%; border-collapse: collapse; }
    .staff-table tr { border-bottom: 1px solid #eee; }
    .staff-table tr:last-child { border-bottom: none; }
    .staff-table td { padding: 12px 8px; font-size: 0.85rem; }
    .staff-table .staff-name { font-weight: 600; color: var(--dark); }
    .staff-table .staff-role { font-size: 0.7rem; color: var(--gray); display: block; }
    .status-badge { font-size: 0.6rem; padding: 3px 8px; border-radius: 20px; background: #eee; white-space: nowrap; display: inline-block; }
    .status-badge.checked-in { background: #d1fae5; color: var(--success); }
    .status-badge.late { background: #fee2e2; color: var(--danger); }
    .status-badge.completed { background: #e0e7ff; color: #4f46e5; }
    .check-btn { padding: 10px 18px; border-radius: 30px; font-weight: 600; font-size: 0.75rem; border: none; cursor: pointer; background: var(--primary); color: white; white-space: nowrap; transition: all 0.2s; font-family: 'Poppins', sans-serif; }
    .check-btn:active { transform: scale(0.95); }
    .check-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--gray); }
    .check-btn.checkout-btn { background: var(--warning); color: white; }
    .message { text-align: center; margin-top: 12px; padding: 14px; border-radius: 30px; font-weight: 500; font-size: 0.9rem; display: none; }
    .message.show { display: block; }
    .message.success { background: rgba(16,185,129,0.2); color: var(--success); }
    .message.warning { background: rgba(245,158,11,0.2); color: var(--warning); }
    .message.error { background: rgba(239,68,68,0.2); color: var(--danger); }

    /* FIXED: inset → expanded properties */
    .uploading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 500; }
    .uploading-overlay.show { display: flex; }
    .uploading-box { background: white; border-radius: 20px; padding: 30px; text-align: center; }
    .spinner { width: 45px; height: 45px; border: 4px solid #ffe0ec; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .uploading-box p { font-weight: 600; color: var(--dark); }
    .footer { display: flex; justify-content: space-between; margin-top: 15px; }
    .btn { padding: 10px 16px; border-radius: 30px; border: none; cursor: pointer; font-weight: 500; font-size: 0.85rem; background: transparent; border: 1px solid var(--gray); color: white; font-family: 'Poppins', sans-serif; }

    /* FIXED: inset → expanded properties */
    .pin-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .pin-modal.show { display: flex; }
    .pin-box { background: white; border-radius: 24px; padding: 30px; text-align: center; max-width: 350px; width: 100%; }
    .pin-box h3 { margin-bottom: 15px; font-size: 1.1rem; }
    .pin-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .pin-input { width: 55px; height: 65px; text-align: center; font-size: 1.8rem; border: 2px solid #ddd; border-radius: 12px; outline: none; font-family: 'Poppins', sans-serif; }
    .pin-input:focus { border-color: var(--primary); }
    .pin-actions { display: flex; gap: 8px; } .pin-actions button { flex: 1; padding: 12px; border-radius: 30px; font-weight: 600; border: none; cursor: pointer; font-family: 'Poppins', sans-serif; }
    .loading { text-align: center; padding: 20px; color: var(--gray); }
    .pin-eye-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 1; }
  </style>
</head>
<body>

<div class="uploading-overlay" id="uploadingOverlay">
  <div class="uploading-box"><div class="spinner"></div><p>Capturing & Uploading Photo...</p><p style="font-size:0.8rem;color:var(--gray);margin-top:5px;">Sending to admin dashboard</p></div>
</div>

<div class="kiosk-container">
  <div class="header"><h1>✨ <span>Omo</span>creations</h1><p>Tap your name · Photo captured & uploaded automatically</p></div>
  <div class="clock"><div class="clock-time" id="liveClock">--:--:--</div><div class="clock-date" id="liveDate"></div></div>
  <div class="stats"><div class="stat"><div class="stat-value" id="presentCount">0</div><div class="stat-label">Present</div></div><div class="stat"><div class="stat-value" id="lateCount">0</div><div class="stat-label">Late</div></div><div class="stat"><div class="stat-value" id="absentCount">0</div><div class="stat-label">Absent</div></div></div>
  <div class="mode-toggle"><button class="mode-btn active" id="checkinModeBtn"><i class="fas fa-sign-in-alt"></i> CHECK-IN</button><button class="mode-btn checkout" id="checkoutModeBtn"><i class="fas fa-sign-out-alt"></i> CHECK-OUT</button></div>
  <div class="camera-section"><div class="camera-container"><video id="webcamVideo" autoplay playsinline></video><canvas id="snapCanvas"></canvas></div><div class="camera-controls"><button onclick="switchCamera()"><i class="fas fa-sync-alt"></i> Switch</button><button onclick="retryCamera()"><i class="fas fa-redo"></i> Retry</button></div></div>
  <div class="staff-section"><h3><i class="fas fa-users" style="color:var(--primary);"></i> Staff List <span style="margin-left:auto;font-size:0.7rem;color:var(--gray);" id="staffCount">0</span></h3><div id="staffListContainer"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading staff...</div></div></div>
  <div class="message" id="messageBanner"></div>
  <div class="footer"><button class="btn" onclick="loadStaffList()"><i class="fas fa-sync-alt"></i> Refresh</button><button class="btn" onclick="showExitModal()"><i class="fas fa-lock"></i> Exit Kiosk</button></div>
</div>

<div class="pin-modal" id="pinModal">
  <div class="pin-box">
    <i class="fas fa-lock" style="font-size:2.5rem;color:var(--primary);margin-bottom:10px;"></i>
    <h3>Admin Verification</h3>
    <p style="color:var(--gray);margin-bottom:20px;font-size:0.85rem;">Enter any admin PIN to exit kiosk</p>
    <div class="pin-inputs" style="position:relative;">
      <input type="password" maxlength="1" class="pin-input" id="pin1" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-input" id="pin2" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-input" id="pin3" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-input" id="pin4" inputmode="numeric">
    </div>
    <div style="text-align:center;margin-bottom:15px;">
      <i class="fas fa-eye pin-eye-btn" id="togglePinEye" onclick="togglePinVisibility()" title="Show/Hide PIN"></i>
    </div>
    <div class="pin-actions">
      <button onclick="hidePinModal()" style="background:#eee;color:var(--dark);">Cancel</button>
      <button onclick="verifyExitPin()" style="background:var(--primary);color:white;">Exit</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, addDoc, serverTimestamp, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI",
    authDomain: "fashion-46e5d.firebaseapp.com",
    projectId: "fashion-46e5d",
    storageBucket: "fashion-46e5d.firebasestorage.app",
    messagingSenderId: "408062284317",
    appId: "1:408062284317:web:eb905bce68926c10a0ecf4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const CLOUDINARY_CLOUD_NAME = 'dw80fw9un';
  const CLOUDINARY_UPLOAD_PRESET = 'kiosk_attendance';
  const CLOUDINARY_UPLOAD_URL = 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload';

  let webcamStream = null, allStaff = [], todayAttendance = new Map();
  let kioskSettings = { checkInHour:9, checkInMinute:0, checkOutHour:18, checkOutMinute:0, latePenalty:5, earlyPenalty:5, absentPenalty:10, adminPin:'1234', cloudinaryCloudName:'dw80fw9un', cloudinaryUploadPreset:'kiosk_attendance' };
  let currentMode = 'checkin', currentFacingMode = 'user';

  async function loginAnonymously() { try { await signInAnonymously(auth); } catch(e) {} }

  onAuthStateChanged(auth, async function(user) {
    if(user) { await loadSettings(); await initCamera(); await loadStaffList(); }
    else { await loginAnonymously(); }
  });

  function updateClock() { var now = new Date(); document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-GB'); document.getElementById('liveDate').textContent = now.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}); }
  setInterval(updateClock, 1000); updateClock();

  async function initCamera(facingMode) {
    facingMode = facingMode || 'user';
    try {
      if(webcamStream) { webcamStream.getTracks().forEach(function(t) { t.stop(); }); }
      webcamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode, width:{ideal:640}, height:{ideal:480} } });
      document.getElementById('webcamVideo').srcObject = webcamStream;
      currentFacingMode = facingMode;
    } catch(e) { showMessage('Camera denied. Please allow camera access.', 'error'); }
  }

  window.switchCamera = async function() { var newMode = currentFacingMode === 'user' ? 'environment' : 'user'; await initCamera(newMode); };
  window.retryCamera = function() { initCamera(currentFacingMode); };

  async function loadSettings() {
    try {
      var snap = await getDoc(doc(db, 'system_settings', 'kiosk'));
      if(snap.exists()) { var s = snap.data(); kioskSettings = Object.assign({}, kioskSettings, s); }
    } catch(e) {}
  }

  async function loadStaffList() {
    try {
      var usersQuery = query(collection(db, 'users'), where('status','==','active'));
      var usersSnap = await getDocs(usersQuery);
      allStaff = usersSnap.docs.map(function(d) { return Object.assign({id:d.id}, d.data()); }).filter(function(u) { return u.role === 'staff' || u.role === 'attendant' || u.role === 'attendant_chief'; });
      var today = new Date().toISOString().split('T')[0];
      var attSnap = await getDocs(query(collection(db, 'attendance'), where('date','==',today)));
      todayAttendance.clear();
      attSnap.docs.forEach(function(d) { var a = d.data(); todayAttendance.set(a.userId, Object.assign({}, a, {docId:d.id})); });
      document.getElementById('presentCount').textContent = attSnap.size;
      document.getElementById('lateCount').textContent = attSnap.docs.filter(function(d) { return d.data().status === 'late'; }).length;
      document.getElementById('absentCount').textContent = allStaff.length - attSnap.size;
      renderStaffTable();
    } catch(e) {}
  }

  function renderStaffTable() {
    var container = document.getElementById('staffListContainer');
    if(allStaff.length === 0) { container.innerHTML = '<div class="loading">No active staff</div>'; return; }
    allStaff.sort(function(a,b) { return (a.fullName || '').localeCompare(b.fullName || ''); });
    document.getElementById('staffCount').textContent = allStaff.length + ' staff';
    var html = '<table class="staff-table">';
    allStaff.forEach(function(staff) {
      var att = todayAttendance.get(staff.id);
      var hasCheckedIn = att && att.checkInTime;
      var hasCheckedOut = att && att.checkOutTime;
      var statusText = 'Not checked in', statusClass = '', buttonText = currentMode === 'checkin' ? 'CHECK IN' : 'CHECK OUT', buttonDisabled = false, buttonClass = currentMode === 'checkin' ? '' : 'checkout-btn';
      if(hasCheckedIn && !hasCheckedOut) { statusText = att.status === 'late' ? 'LATE' : 'Checked In'; statusClass = att.status === 'late' ? 'late' : 'checked-in'; if(currentMode === 'checkin') buttonDisabled = true; }
      else if(hasCheckedIn && hasCheckedOut) { statusText = 'Done'; statusClass = 'completed'; buttonDisabled = true; }
      if(currentMode === 'checkout') { if(!hasCheckedIn) buttonDisabled = true; if(hasCheckedOut) buttonDisabled = true; }
      html += '<tr><td><span class="staff-name">' + (staff.fullName || 'Staff') + '</span><span class="staff-role">' + (staff.role || 'staff') + '</span></td><td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td><td style="text-align:right;"><button class="check-btn ' + buttonClass + '" onclick="handleAction(\'' + staff.id + '\')" ' + (buttonDisabled ? 'disabled' : '') + '><i class="fas fa-' + (currentMode === 'checkin' ? 'sign-in-alt' : 'sign-out-alt') + '"></i> ' + buttonText + '</button></td></tr>';
    });
    html += '</table>'; container.innerHTML = html;

    window.handleAction = async function(staffId) {
      var staff = allStaff.find(function(s) { return s.id === staffId; }); if(!staff) return;
      var att = todayAttendance.get(staffId);
      document.getElementById('uploadingOverlay').classList.add('show');
      try { if(currentMode === 'checkin') await processCheckIn(staff); else await processCheckOut(staff, att); }
      finally { document.getElementById('uploadingOverlay').classList.remove('show'); }
    };
  }

  function capturePhoto() {
    var video = document.getElementById('webcamVideo');
    var canvas = document.getElementById('snapCanvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    var ctx = canvas.getContext('2d');
    if(currentFacingMode === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    return new Promise(function(resolve) { canvas.toBlob(function(blob) { resolve(blob); }, 'image/jpeg', 0.85); });
  }

  async function uploadToCloudinary(imageBlob, staffName, type) {
    var formData = new FormData();
    formData.append('file', imageBlob);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    formData.append('folder', 'kiosk_attendance');
    formData.append('public_id', type + '_' + Date.now() + '_' + staffName.replace(/\s+/g,'_'));
    var response = await fetch(CLOUDINARY_UPLOAD_URL, { method:'POST', body:formData });
    var data = await response.json();
    if(data.secure_url) return { url:data.secure_url, publicId:data.public_id };
    else throw new Error((data.error && data.error.message) || 'Upload failed');
  }

  async function processCheckIn(staff) {
    try {
      var imageBlob = await capturePhoto();
      var cloudinaryResult = await uploadToCloudinary(imageBlob, staff.fullName, 'checkin');
      var now = new Date();
      var checkInTime = new Date(); checkInTime.setHours(kioskSettings.checkInHour, kioskSettings.checkInMinute, 0);
      var isLate = now > checkInTime;
      var status = isLate ? 'late' : 'on_time';
      var pointsDeducted = isLate ? kioskSettings.latePenalty : 0;

      await addDoc(collection(db, 'attendance'), {
        userId: staff.id, staffName: staff.fullName,
        checkInTime: serverTimestamp(), date: now.toISOString().split('T')[0],
        status: status, pointsDeducted: pointsDeducted,
        photoUrl: cloudinaryResult.url, photoPublicId: cloudinaryResult.publicId
      });

      if(pointsDeducted > 0) {
        await updateDoc(doc(db, 'users', staff.id), { totalPoints: increment(-pointsDeducted) });
        await addDoc(collection(db, 'audit_logs'), {
          actionType: 'points_deducted',
          performedBy: staff.id,
          performedByName: 'Kiosk System',
          performedAt: serverTimestamp(),
          note: 'Late check-in at ' + now.toLocaleTimeString('en-GB') + ' (threshold ' + checkInTime.toLocaleTimeString('en-GB') + '). -' + pointsDeducted + ' points.'
        });
      } else {
        await addDoc(collection(db, 'audit_logs'), {
          actionType: 'attendance_marked',
          performedBy: staff.id,
          performedByName: 'Kiosk System',
          performedAt: serverTimestamp(),
          note: staff.fullName + ' checked in on time.'
        });
      }

      await addDoc(collection(db, 'kiosk_photos'), {
        staffId: staff.id, staffName: staff.fullName,
        type: 'checkin', photoUrl: cloudinaryResult.url,
        timestamp: serverTimestamp(), date: now.toISOString().split('T')[0]
      });

      showMessage(staff.fullName + ' checked in ' + (isLate ? '(LATE -' + pointsDeducted + 'pts)' : '✓ On time!'), isLate ? 'warning' : 'success');
      await loadStaffList();
    } catch(e) { showMessage('Check-in failed', 'error'); }
  }

  async function processCheckOut(staff, att) {
    try {
      var imageBlob = await capturePhoto();
      var cloudinaryResult = await uploadToCloudinary(imageBlob, staff.fullName, 'checkout');
      var now = new Date();
      var checkOutTime = new Date(); checkOutTime.setHours(kioskSettings.checkOutHour, kioskSettings.checkOutMinute, 0);
      var isEarly = now < checkOutTime;
      var checkOutStatus = isEarly ? 'early' : 'on_time';
      var pointsDeducted = isEarly ? kioskSettings.earlyPenalty : 0;

      await updateDoc(doc(db, 'attendance', att.docId), {
        checkOutTime: serverTimestamp(), checkOutStatus: checkOutStatus,
        pointsDeducted: (att.pointsDeducted || 0) + pointsDeducted,
        checkOutPhotoUrl: cloudinaryResult.url, checkOutPhotoPublicId: cloudinaryResult.publicId
      });

      if(pointsDeducted > 0) {
        await updateDoc(doc(db, 'users', staff.id), { totalPoints: increment(-pointsDeducted) });
        await addDoc(collection(db, 'audit_logs'), {
          actionType: 'points_deducted',
          performedBy: staff.id,
          performedByName: 'Kiosk System',
          performedAt: serverTimestamp(),
          note: 'Early departure at ' + now.toLocaleTimeString('en-GB') + ' (threshold ' + checkOutTime.toLocaleTimeString('en-GB') + '). -' + pointsDeducted + ' points.'
        });
      } else {
        await addDoc(collection(db, 'audit_logs'), {
          actionType: 'attendance_marked',
          performedBy: staff.id,
          performedByName: 'Kiosk System',
          performedAt: serverTimestamp(),
          note: staff.fullName + ' checked out on time.'
        });
      }

      await addDoc(collection(db, 'kiosk_photos'), {
        staffId: staff.id, staffName: staff.fullName,
        type: 'checkout', photoUrl: cloudinaryResult.url,
        timestamp: serverTimestamp(), date: now.toISOString().split('T')[0]
      });

      showMessage(staff.fullName + ' checked out ' + (isEarly ? '(EARLY -' + pointsDeducted + 'pts)' : '✓ On time!'), isEarly ? 'warning' : 'success');
      await loadStaffList();
    } catch(e) { showMessage('Check-out failed', 'error'); }
  }

  function showMessage(msg, type) { var el = document.getElementById('messageBanner'); el.textContent = msg; el.className = 'message show ' + type; setTimeout(function() { el.classList.remove('show'); }, 3000); }

  document.getElementById('checkinModeBtn').addEventListener('click', function() { currentMode = 'checkin'; document.getElementById('checkinModeBtn').classList.add('active'); document.getElementById('checkoutModeBtn').classList.remove('active'); renderStaffTable(); });
  document.getElementById('checkoutModeBtn').addEventListener('click', function() { currentMode = 'checkout'; document.getElementById('checkoutModeBtn').classList.add('active'); document.getElementById('checkinModeBtn').classList.remove('active'); renderStaffTable(); });

  window.showExitModal = function() { document.getElementById('pinModal').classList.add('show'); document.getElementById('pin1').focus(); };
  window.hidePinModal = function() { document.getElementById('pinModal').classList.remove('show'); ['pin1','pin2','pin3','pin4'].forEach(function(id) { document.getElementById(id).value = ''; }); };

  window.togglePinVisibility = function() {
    var inputs = document.querySelectorAll('#pinModal .pin-input');
    var eye = document.getElementById('togglePinEye');
    var isPassword = inputs[0].type === 'password';
    inputs.forEach(function(inp) { inp.type = isPassword ? 'text' : 'password'; });
    if (eye) { eye.classList.toggle('fa-eye', !isPassword); eye.classList.toggle('fa-eye-slash', isPassword); }
  };

  window.verifyExitPin = async function() {
    var pin = ['pin1','pin2','pin3','pin4'].map(function(id) { return document.getElementById(id).value; }).join('');
    if (pin === kioskSettings.adminPin) { exitKiosk(); return; }
    try {
      var adminsSnap = await getDocs(query(collection(db, 'users'), where('role', 'in', ['admin', 'super_admin']), where('status', '==', 'active')));
      var valid = false;
      adminsSnap.forEach(function(d) {
        var data = d.data();
        if (data.adminPin === pin || data.attendantPin === pin) { valid = true; }
      });
      if (valid) { exitKiosk(); }
      else { alert('Invalid PIN'); }
    } catch (e) { alert('Error verifying PIN'); }
  };

  function exitKiosk() {
    if (webcamStream) { webcamStream.getTracks().forEach(function(t) { t.stop(); }); }
    window.location.href = 'admin-dashboard.html';
  }

  document.querySelectorAll('.pin-input').forEach(function(inp, i, arr) {
    inp.addEventListener('input', function(e) { if(e.target.value && i < arr.length - 1) arr[i+1].focus(); });
  });

  window.loadStaffList = loadStaffList;
</script>
</body>
</html>
