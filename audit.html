<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4da6">
  <title>Audit Logs · OmoCreations</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root { 
      --primary: #ff4da6; 
      --primary-dark: #e6398c; 
      --primary-light: #ffb3d9;
      --primary-soft: #fff0f6; 
      --dark: #1a1a2e; 
      --gray: #6b7280; 
      --gray-light: #f3f4f6; 
      --success: #10b981; 
      --warning: #f59e0b; 
      --danger: #ef4444; 
      --info: #3b82f6; 
      --sidebar-width: 280px; 
      --sidebar-collapsed: 80px; 
      --header-height: 70px; 
    }
    
    body { 
      font-family: 'Poppins', sans-serif; 
      background: linear-gradient(135deg, #f9fafb 0%, #fff0f6 100%);
      display: flex; 
      min-height: 100vh; 
    }
    
    /* Flame Ring Animation */
    @keyframes flameRing {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 166, 0.4); }
      50% { box-shadow: 0 0 0 5px rgba(255, 77, 166, 0.2); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 166, 0); }
    }
    
    /* Sidebar with Gradient Background */
    .sidebar { 
      width: var(--sidebar-width); 
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%); 
      color: white; 
      position: fixed; 
      height: 100vh; 
      overflow-y: auto; 
      transition: width 0.25s ease, transform 0.3s ease; 
      z-index: 1000; 
      border-right: 1px solid rgba(255, 77, 166, 0.2);
    }
    
    /* Desktop collapsed sidebar - expands on hover */
    @media (min-width: 769px) {
      .sidebar.collapsed { 
        width: var(--sidebar-collapsed); 
      }
      .sidebar.collapsed:hover {
        width: var(--sidebar-width);
      }
      .sidebar.collapsed:hover .logo-text,
      .sidebar.collapsed:hover .nav-text,
      .sidebar.collapsed:hover .user-details,
      .sidebar.collapsed:hover .nav-section-title {
        display: block;
      }
      .sidebar.collapsed .logo-text,
      .sidebar.collapsed .nav-text,
      .sidebar.collapsed .user-details,
      .sidebar.collapsed .nav-section-title {
        display: none;
      }
    }
    
    /* Mobile sidebar - slides in */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .sidebar.collapsed {
        transform: translateX(-100%);
      }
    }
    
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    
    .sidebar-header { 
      padding: 24px 18px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,77,166,0.2);
    }
    
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon { 
      width: 42px; 
      height: 42px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      font-weight: 700;
      animation: flameRing 2s ease-in-out infinite;
    }
    
    .logo-text { 
      font-size: 1.25rem; 
      font-weight: 800; 
      font-family: 'Playfair Display', serif;
      white-space: nowrap;
    } 
    
    .logo-text span { color: var(--primary); }
    
    .close-sidebar {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    
    .close-sidebar:hover {
      background: var(--primary);
      transform: rotate(90deg);
    }
    
    @media (max-width: 768px) {
      .close-sidebar {
        display: flex;
      }
    }
    
    .sidebar-nav { 
      padding: 20px 12px; 
      display: flex; 
      flex-direction: column; 
      height: calc(100vh - 100px); 
      overflow-y: auto; 
    }
    
    .nav-section { margin-bottom: 24px; }
    
    .nav-section-title { 
      font-size: 0.7rem; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: rgba(255,255,255,0.4); 
      margin-bottom: 10px; 
      padding-left: 14px; 
      font-weight: 600; 
    }
    
    .nav-item { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      padding: 12px 14px; 
      border-radius: 12px; 
      color: rgba(255,255,255,0.7); 
      cursor: pointer; 
      border: none; 
      background: none; 
      width: 100%; 
      font-size: 0.9rem; 
      font-weight: 500; 
      text-align: left; 
      margin-bottom: 3px; 
      transition: all 0.2s; 
      font-family: 'Poppins', sans-serif;
    }
    
    .nav-item i { width: 22px; font-size: 1.1rem; }
    
    .nav-item:hover { 
      background: rgba(255,77,166,0.15); 
      color: white; 
      transform: translateX(5px);
    }
    
    .nav-item.active { 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      color: white; 
      box-shadow: 0 5px 15px rgba(255,77,166,0.3);
    }
    
    .nav-item.logout { 
      color: rgba(239,68,68,0.7); 
      margin-top: auto; 
    }
    
    .nav-item.logout:hover {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
    }
    
    .sidebar-footer { 
      padding: 20px 16px; 
      border-top: 1px solid rgba(255,77,166,0.2); 
      margin-top: auto;
    }
    
    /* Sidebar Overlay for Mobile */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }
    
    .sidebar-overlay.active {
      display: block;
    }
    
    .user-profile { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    }
    
    .user-avatar { 
      width: 44px; 
      height: 44px; 
      border-radius: 12px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 700; 
      color: white; 
      font-size: 1.1rem;
    }
    
    .user-details h4 { font-size: 0.85rem; font-weight: 600; } 
    .user-details p { font-size: 0.7rem; opacity: 0.6; }
    
    /* Main content */
    .main-content { 
      flex: 1; 
      margin-left: var(--sidebar-width); 
      transition: margin-left 0.25s ease; 
      min-height: 100vh; 
      width: calc(100% - var(--sidebar-width)); 
    }
    
    @media (max-width: 768px) {
      .main-content { 
        margin-left: 0 !important; 
        width: 100% !important; 
      }
    }
    
    @media (min-width: 769px) {
      .sidebar.collapsed + .main-content { 
        margin-left: var(--sidebar-collapsed); 
        width: calc(100% - var(--sidebar-collapsed)); 
      }
    }
    
    /* Top Bar */
    .top-bar { 
      height: var(--header-height); 
      background: rgba(255,255,255,0.98); 
      backdrop-filter: blur(12px); 
      padding: 0 28px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      border-bottom: 1px solid rgba(255,77,166,0.15);
      position: sticky; 
      top: 0; 
      z-index: 50; 
    }
    
    .top-bar-left { 
      display: flex; 
      align-items: center; 
      gap: 18px; 
    }
    
    .menu-toggle { 
      background: none; 
      border: none; 
      font-size: 1.2rem; 
      color: var(--gray); 
      cursor: pointer; 
      padding: 10px; 
      border-radius: 10px; 
      transition: all 0.2s;
    }
    
    .menu-toggle:hover { 
      background: var(--primary-soft); 
      color: var(--primary); 
      transform: scale(1.05);
    }
    
    .page-title { 
      font-size: 1.5rem; 
      font-weight: 700; 
      color: var(--dark); 
      font-family: 'Playfair Display', serif;
    }
    
    .content-wrapper { 
      padding: 28px; 
      max-width: 1600px; 
    }
    
    /* Filter Bar */
    .filter-bar { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
      align-items: center;
    }
    
    .filter-select { 
      padding: 12px 20px; 
      border: 1.5px solid rgba(0,0,0,0.08); 
      border-radius: 40px; 
      font-size: 0.85rem; 
      background: white;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-select:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .search-wrapper { 
      flex: 1; 
      min-width: 200px; 
      position: relative; 
    }
    
    .search-wrapper i { 
      position: absolute; 
      left: 14px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: var(--gray); 
    }
    
    .search-input { 
      width: 100%; 
      padding: 12px 16px 12px 42px; 
      border: 1.5px solid rgba(0,0,0,0.08); 
      border-radius: 40px; 
      font-size: 0.85rem; 
      outline: none;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s;
    }
    
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,77,166,0.1);
    }
    
    /* Panel */
    .panel { 
      background: white; 
      border-radius: 24px; 
      padding: 24px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
      border: 1px solid rgba(255,77,166,0.08);
      transition: all 0.3s;
    }
    
    .panel:hover {
      box-shadow: 0 8px 25px rgba(255,77,166,0.08);
    }
    
    .panel-header { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 20px; 
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .panel-header h3 { 
      font-size: 1.1rem; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      color: var(--dark);
    }
    
    .panel-header h3 i { color: var(--primary); }
    
    /* Tables */
    .table-wrapper { 
      overflow-x: auto; 
      border-radius: 16px; 
    }
    
    .data-table { 
      width: 100%; 
      border-collapse: collapse; 
      min-width: 900px; 
    }
    
    .data-table th { 
      text-align: left; 
      padding: 14px 12px; 
      font-size: 0.7rem; 
      font-weight: 600; 
      color: var(--gray); 
      text-transform: uppercase; 
      letter-spacing: 1px;
      border-bottom: 2px solid var(--primary-soft); 
    }
    
    .data-table td { 
      padding: 14px 12px; 
      border-bottom: 1px solid rgba(0,0,0,0.04); 
      font-size: 0.85rem; 
    }
    
    /* Badges */
    .badge { 
      padding: 5px 12px; 
      border-radius: 40px; 
      font-size: 0.7rem; 
      font-weight: 600; 
      display: inline-block; 
    }
    .badge-info { background: rgba(59,130,246,0.1); color: var(--info); }
    
    /* Buttons */
    .btn { 
      padding: 10px 20px; 
      border-radius: 40px; 
      font-weight: 600; 
      font-size: 0.8rem; 
      border: none; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      background: white; 
      border: 1px solid rgba(0,0,0,0.08); 
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    
    .btn:hover { transform: translateY(-2px); }
    
    .btn-outline { 
      border: 1.5px solid rgba(255,77,166,0.3); 
      color: var(--primary); 
      background: transparent; 
    }
    
    .btn-danger { 
      background: linear-gradient(135deg, var(--danger), #dc2626); 
      color: white; 
      border: none;
    }
    
    .btn-sm { padding: 6px 14px; font-size: 0.7rem; }
    
    /* Empty State */
    .empty-state { 
      text-align: center; 
      padding: 40px; 
      color: var(--gray); 
    }
    .empty-state i { font-size: 2.5rem; color: var(--primary-light); margin-bottom: 10px; }
    
    /* Toast */
    .toast-container { 
      position: fixed; 
      bottom: 24px; 
      right: 24px; 
      z-index: 9999; 
    }
    
    .toast { 
      background: white; 
      padding: 14px 20px; 
      border-radius: 50px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.12); 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      transform: translateX(400px); 
      transition: transform 0.25s; 
      border-left: 4px solid var(--primary); 
      margin-top: 10px;
    }
    
    .toast.show { transform: translateX(0); }
    
    /* Responsive */
    @media (max-width: 992px) { 
      .sidebar { width: var(--sidebar-collapsed); } 
      .sidebar .logo-text, .sidebar .nav-text, .sidebar .user-details, .sidebar .nav-section-title { display: none; } 
      .main-content { margin-left: var(--sidebar-collapsed); } 
    }
    @media (max-width: 768px) { 
      .content-wrapper { padding: 16px; } 
      .top-bar { padding: 0 16px; }
      .page-title { font-size: 1.2rem; }
      .filter-bar { flex-direction: column; }
      .search-wrapper { width: 100%; }
      .filter-select { width: 100%; }
    }
  </style>
</head>
<body>

<!-- Main Content -->
<main class="main-content">
  <header class="top-bar">

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, getDocs, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI", authDomain: "fashion-46e5d.firebaseapp.com", projectId: "fashion-46e5d", storageBucket: "fashion-46e5d.firebasestorage.app", messagingSenderId: "408062284317", appId: "1:408062284317:web:eb905bce68926c10a0ecf4" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
  let currentUser = null, userData = null, unsubscribes = [], allLogs = [], currentFilter = 'all';

  // Sidebar functions
  window.toggleSidebar = function() { 
    const sidebar = document.getElementById('sidebar'); 
    const overlay = document.getElementById('sidebarOverlay'); 
    if (window.innerWidth <= 768) { 
      sidebar.classList.add('mobile-open'); 
      overlay.classList.add('active'); 
    } else { 
      sidebar.classList.toggle('collapsed'); 
    } 
  };
  
  window.closeSidebar = function() { 
    const sidebar = document.getElementById('sidebar'); 
    const overlay = document.getElementById('sidebarOverlay'); 
    sidebar.classList.remove('mobile-open'); 
    overlay.classList.remove('active'); 
    if (window.innerWidth > 768) {
      sidebar.classList.add('collapsed');
    }
  };

  function formatDateTime(d) { 
    if (!d) return '-'; 
    const date = d.toDate ? d.toDate() : new Date(d); 
    return date.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); 
  }
  
  function showToast(msg, type='success') { 
    const c = document.getElementById('toastContainer'); 
    const t = document.createElement('div'); 
    t.className = `toast ${type}`; 
    t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i><span>${msg}</span>`; 
    c.appendChild(t); 
    setTimeout(() => t.classList.add('show'), 10); 
    setTimeout(() => t.remove(), 4000); 
  }
  
  async function logAudit(action, note) { 
    try { 
      await addDoc(collection(db, 'audit_logs'), { 
        actionType: action, 
        performedBy: currentUser?.uid, 
        performedByName: userData?.fullName, 
        performedAt: serverTimestamp(), 
        note 
      }); 
    } catch(e) {} 
  }

  function renderAudit() {
    let filtered = [...allLogs]; 
    const search = document.getElementById('searchInput').value.toLowerCase();
    if (search) filtered = filtered.filter(l => (l.performedByName||'').toLowerCase().includes(search) || (l.note||'').toLowerCase().includes(search));
    if (currentFilter !== 'all') filtered = filtered.filter(l => l.actionType === currentFilter);
    
    const tbody = document.getElementById('auditTable'); 
    tbody.innerHTML = '';
    if (filtered.length === 0) { 
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-history"></i><p>No audit logs found</p></div>NonNull<td></tr>'; 
      return; 
    }
    filtered.slice(0, 100).forEach(l => { 
      tbody.innerHTML += `<tr>
        <td>${formatDateTime(l.performedAt)}</td>
        <td><span class="badge badge-info">${l.actionType}</span></td>
        <td>${l.performedByName||l.performedBy?.slice(0,8)||'System'}</td>
        <td>${l.collectionName||'-'}</td>
        <td>${l.documentId?.slice(0,12)||'-'}</td>
        <td>${l.note||'-'}</td>
      </tr>`; 
    });
  }

  function loadAuditLogs() { 
    unsubscribes.forEach(u => u()); 
    unsubscribes = []; 
    unsubscribes.push(onSnapshot(query(collection(db, 'audit_logs'), orderBy('performedAt', 'desc')), snap => { 
      allLogs = snap.docs.map(d => ({id:d.id, ...d.data()})); 
      renderAudit(); 
    })); 
  }

  window.requestDeleteAudit = async () => { 
    const days = prompt('Delete logs older than how many days? (e.g., 30)'); 
    if (!days) return; 
    const reqRef = await addDoc(collection(db, 'deletion_requests'), { 
      type: 'audit_logs', 
      days: parseInt(days), 
      requestedBy: currentUser.uid, 
      requestedByName: userData.fullName, 
      status: 'pending_approval', 
      createdAt: serverTimestamp(), 
      approvedBy: [] 
    }); 
    const admins = await getDocs(query(collection(db, 'users'), where('role', 'in', ['admin','super_admin']))); 
    admins.forEach(async d => { 
      if (d.id !== currentUser.uid) await addDoc(collection(db, 'notifications'), { 
        userId: d.id, 
        type: 'deletion_approval', 
        title: 'Audit Deletion Request', 
        message: `${userData.fullName} requested deletion of logs older than ${days} days.`, 
        isRead: false, 
        requestId: reqRef.id, 
        createdAt: serverTimestamp() 
      }); 
    }); 
    await logAudit('deletion_request', `Requested deletion of logs > ${days} days`); 
    showToast('Deletion request sent for approval', 'info'); 
  };

  window.refreshData = () => loadAuditLogs();

  document.getElementById('exportBtn').addEventListener('click', () => { 
    let filtered = allLogs; 
    const search = document.getElementById('searchInput').value.toLowerCase(); 
    if (search) filtered = filtered.filter(l => (l.performedByName||'').toLowerCase().includes(search) || (l.note||'').toLowerCase().includes(search)); 
    if (currentFilter !== 'all') filtered = filtered.filter(l => l.actionType === currentFilter); 
    const csv = ['Timestamp,Action,User,Collection,Document ID,Details'].concat(filtered.map(l => `"${formatDateTime(l.performedAt)}","${l.actionType}","${l.performedByName||l.performedBy}","${l.collectionName||''}","${l.documentId||''}","${l.note||''}"`)).join('\n'); 
    const b = new Blob([csv], {type:'text/csv'}); 
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(b); 
    a.download = `audit_${new Date().toISOString().split('T')[0]}.csv`; 
    a.click(); 
    showToast('Exported', 'success'); 
  });
  
  document.getElementById('searchInput').addEventListener('input', renderAudit);
  document.getElementById('actionFilter').addEventListener('change', e => { currentFilter = e.target.value; renderAudit(); });
  document.getElementById('requestDeleteBtn').addEventListener('click', requestDeleteAudit);

  onAuthStateChanged(auth, async (u) => { 
    if (!u) { window.location.href = 'auth.html'; return; } 
    currentUser = u; 
    const snap = await getDoc(doc(db, 'users', u.uid)); 
    if (!snap.exists() || (snap.data().role !== 'admin' && snap.data().role !== 'super_admin')) { 
      await signOut(auth);
      window.location.href = 'auth.html'; 
      return; 
    }
    userData = snap.data(); 
    document.getElementById('userName').textContent = userData.fullName?.split(' ')[0] || 'Admin'; 
    document.getElementById('userRole').textContent = userData.role === 'super_admin' ? 'Super Admin' : 'Admin'; 
    document.getElementById('userAvatar').textContent = (userData.fullName||'A').charAt(0); 
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); 
    loadAuditLogs(); 
  });
  
  document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href = 'auth.html'; });
  window.addEventListener('beforeunload', () => unsubscribes.forEach(u => u()));
</script>
</body>
</html>
