<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4da6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Orders · OmoCreations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --primary:#ff4da6; --primary-dark:#e6398c; --primary-light:#ffb3d9;
      --primary-soft:#fff0f6; --dark:#1a1a2e; --gray:#6b7280;
      --gray-light:#f3f4f6; --success:#10b981; --warning:#f59e0b;
      --danger:#ef4444; --info:#3b82f6;
      --sidebar-width:280px; --header-height:70px;
    }

    html { font-size:16px; -webkit-text-size-adjust:100%; }

    body {
      font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#f9fafb 0%,#fff0f6 100%);
      display:flex; min-height:100vh; overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    @keyframes flameRing { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,166,0.4)}50%{box-shadow:0 0 0 10px rgba(255,77,166,0)} }
    @keyframes fadeInUp { from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1} }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1} }

    .sidebar {
      width:var(--sidebar-width); min-width:var(--sidebar-width);
      background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1a 100%);
      color:white; position:fixed; top:0; left:0; height:100vh;
      overflow-y:auto; overflow-x:hidden; transition:transform 0.3s ease; z-index:1000;
      border-right:1px solid rgba(255,77,166,0.2);
    }
    .sidebar::-webkit-scrollbar { width:4px; }
    .sidebar::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); }
    .sidebar::-webkit-scrollbar-thumb { background:var(--primary); border-radius:10px; }

    .sidebar-header {
      padding:24px 18px; display:flex; align-items:center; gap:12px;
      border-bottom:1px solid rgba(255,77,166,0.2); position:sticky; top:0; z-index:10;
      background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1a 100%);
    }
    .sidebar-header .close-sidebar {
      display:none; background:rgba(255,255,255,0.1); border:none; color:white;
      width:32px; height:32px; border-radius:50%; cursor:pointer;
      font-size:1.2rem; margin-left:auto; align-items:center; justify-content:center;
    }
    .logo-icon {
      width:42px; height:42px; background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      border-radius:12px; display:flex; align-items:center; justify-content:center;
      font-size:1.3rem; font-weight:700; flex-shrink:0;
      animation:flameRing 2s ease-in-out infinite;
    }
    .logo-text { font-size:1.25rem; font-weight:800; font-family:'Playfair Display',serif; white-space:nowrap; }
    .logo-text span { color:var(--primary); }

    .sidebar-nav { padding:20px 12px; display:flex; flex-direction:column; }
    .nav-section { margin-bottom:20px; }
    .nav-section-title {
      font-size:0.65rem; text-transform:uppercase; letter-spacing:2px;
      color:rgba(255,255,255,0.4); padding:8px 14px 6px; font-weight:600; white-space:nowrap;
    }
    .nav-item {
      display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px;
      color:rgba(255,255,255,0.7); cursor:pointer; border:none; background:none;
      width:100%; font-size:0.9rem; font-weight:500; text-align:left; margin-bottom:3px;
      transition:all 0.2s; font-family:'Poppins',sans-serif; white-space:nowrap; text-decoration:none;
    }
    .nav-item i { width:22px; font-size:1.1rem; text-align:center; flex-shrink:0; }
    .nav-item:hover { background:rgba(255,77,166,0.15); color:white; transform:translateX(5px); }
    .nav-item.active { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; box-shadow:0 5px 15px rgba(255,77,166,0.3); }
    .nav-item.logout { color:rgba(239,68,68,0.7); margin-top:auto; }
    .nav-item.logout:hover { background:rgba(239,68,68,0.15); color:#ef4444; }

    .sidebar-footer {
      padding:20px; border-top:1px solid rgba(255,77,166,0.2);
      position:sticky; bottom:0; background:linear-gradient(0deg,#0f0f1a 0%,transparent 100%);
    }
    .user-profile { display:flex; align-items:center; gap:12px; }
    .user-avatar {
      width:44px; height:44px; border-radius:12px;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      display:flex; align-items:center; justify-content:center;
      font-weight:700; color:white; flex-shrink:0; font-size:1.1rem;
    }
    .user-details { white-space:nowrap; }
    .user-details h4 { font-size:0.85rem; font-weight:600; }
    .user-details p { font-size:0.7rem; opacity:0.6; }

    .sidebar-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.5);
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:999; display:none;
    }
    .sidebar-overlay.active { display:block; }

    .main-content {
      flex:1; margin-left:var(--sidebar-width); transition:margin-left 0.3s ease;
      min-height:100vh; width:calc(100% - var(--sidebar-width));
    }

    .top-bar {
      height:var(--header-height); background:rgba(255,255,255,0.98);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      padding:0 28px; display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(255,77,166,0.15); position:sticky; top:0; z-index:50;
    }
    .top-bar-left { display:flex; align-items:center; gap:14px; }
    .menu-toggle {
      background:none; border:none; font-size:1.3rem; color:var(--gray);
      cursor:pointer; padding:10px; border-radius:10px; transition:all 0.2s;
      display:none; align-items:center; justify-content:center;
    }
    .menu-toggle:hover { background:var(--primary-soft); color:var(--primary); }
    .page-title { font-size:1.5rem; font-weight:700; color:var(--dark); font-family:'Playfair Display',serif; }
    .current-date { color:var(--gray); font-size:0.85rem; white-space:nowrap; }
    .content-wrapper { padding:28px; max-width:1600px; }

    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
    .stat-card {
      background:white; padding:18px 16px; border-radius:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.03); border:1px solid rgba(255,77,166,0.1);
      transition:all 0.3s; animation:fadeInUp 0.5s ease forwards; opacity:0;
    }
    .stat-card:nth-child(1){animation-delay:0.05s}.stat-card:nth-child(2){animation-delay:0.1s}
    .stat-card:nth-child(3){animation-delay:0.15s}.stat-card:nth-child(4){animation-delay:0.2s}
    .stat-card:hover { transform:translateY(-5px); box-shadow:0 12px 24px rgba(255,77,166,0.15); }
    .stat-header { display:flex; justify-content:space-between; margin-bottom:12px; }
    .stat-header span { font-size:0.65rem; color:var(--gray); text-transform:uppercase; font-weight:600; letter-spacing:1px; }
    .stat-icon { width:36px; height:36px; border-radius:12px; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; color:var(--primary); }
    .stat-value { font-size:1.8rem; font-weight:800; color:var(--dark); font-family:'Playfair Display',serif; line-height:1; }

    .tabs-container {
      background:white; border-radius:20px; padding:6px; margin-bottom:24px;
      display:flex; gap:6px; box-shadow:0 2px 8px rgba(0,0,0,0.02); flex-wrap:wrap;
    }
    .tab {
      padding:12px 20px; border-radius:16px; font-weight:600; font-size:0.85rem;
      cursor:pointer; border:none; background:none; color:var(--gray);
      display:flex; align-items:center; gap:8px; transition:all 0.2s;
      font-family:'Poppins',sans-serif;
    }
    .tab:hover { background:var(--primary-soft); color:var(--primary); }
    .tab.active { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; }
    .tab .count {
      background:rgba(255,255,255,0.25); padding:2px 10px; border-radius:30px;
      font-size:0.7rem; font-weight:700; min-width:24px; text-align:center;
    }

    .filter-bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
    .search-wrapper { flex:1; min-width:200px; position:relative; }
    .search-wrapper i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--gray); }
    .search-input {
      width:100%; padding:12px 16px 12px 42px; border:1.5px solid rgba(0,0,0,0.08);
      border-radius:40px; font-size:0.85rem; outline:none; font-family:'Poppins',sans-serif;
    }
    .search-input:focus { border-color:var(--primary); }
    .filter-select {
      padding:12px 20px; border:1.5px solid rgba(0,0,0,0.08); border-radius:40px;
      font-size:0.85rem; background:white; cursor:pointer; outline:none; font-family:'Poppins',sans-serif;
    }

    .panel {
      background:white; border-radius:24px; padding:24px;
      box-shadow:0 2px 8px rgba(0,0,0,0.02); border:1px solid rgba(255,77,166,0.08); margin-bottom:24px;
    }
    .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .panel-header h3 { font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:10px; color:var(--dark); }
    .panel-header h3 i { color:var(--primary); }

    .table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:16px; }
    .data-table { width:100%; border-collapse:collapse; min-width:1200px; }
    .data-table th {
      text-align:left; padding:14px 10px; font-size:0.7rem; font-weight:600;
      color:var(--gray); text-transform:uppercase; letter-spacing:1px;
      border-bottom:2px solid var(--primary-soft); white-space:nowrap; background:white;
    }
    .data-table td { padding:14px 10px; border-bottom:1px solid rgba(0,0,0,0.04); font-size:0.85rem; }
    .data-table tbody tr { transition:background 0.2s; }
    .data-table tbody tr:hover { background:var(--primary-soft); }

    .badge { padding:5px 12px; border-radius:40px; font-size:0.7rem; font-weight:600; display:inline-block; white-space:nowrap; }
    .badge-success { background:rgba(16,185,129,0.1); color:var(--success); }
    .badge-warning { background:rgba(245,158,11,0.1); color:var(--warning); }
    .badge-danger { background:rgba(239,68,68,0.1); color:var(--danger); }
    .badge-info { background:rgba(59,130,246,0.1); color:var(--info); }
    .badge-purple { background:rgba(139,92,246,0.1); color:#8b5cf6; }

    .btn {
      padding:8px 16px; border-radius:40px; font-weight:600; font-size:0.75rem;
      cursor:pointer; display:inline-flex; align-items:center; gap:6px;
      background:white; border:1px solid rgba(0,0,0,0.08); transition:all 0.2s;
      font-family:'Poppins',sans-serif; white-space:nowrap;
    }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; }
    .btn-outline { border:1.5px solid rgba(255,77,166,0.3); color:var(--primary); background:transparent; }
    .btn-sm { padding:6px 12px; font-size:0.7rem; }
    .btn-success { background:var(--success); color:white; border:none; }
    .btn-warning { background:var(--warning); color:white; border:none; }

    .page-view { display:none; }
    .page-view.active { display:block; }

    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center; z-index:2000; padding:16px;
    }
    .modal-overlay.active { display:flex; }
    .modal {
      background:white; border-radius:24px; padding:28px; max-width:650px;
      width:100%; max-height:85vh; overflow-y:auto; animation:fadeInUp 0.3s ease;
    }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .modal-header h3 { font-size:1.2rem; font-weight:700; }
    .modal-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray); }
    .modal-close:hover { color:var(--danger); transform:rotate(90deg); }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:0.8rem; font-weight:600; color:var(--dark); margin-bottom:6px; }
    .form-control {
      width:100%; padding:12px 16px; border:1.5px solid rgba(0,0,0,0.08);
      border-radius:14px; font-size:0.9rem; outline:none; background:white;
      font-family:'Poppins',sans-serif; transition:border 0.2s;
    }
    .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(255,77,166,0.1); }
    textarea.form-control { min-height:80px; resize:vertical; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

    .order-detail-section { margin-bottom:20px; }
    .order-detail-section h4 { font-size:0.9rem; font-weight:700; margin-bottom:10px; color:var(--dark); display:flex; align-items:center; gap:8px; }
    .order-items-table { width:100%; border-collapse:collapse; font-size:0.85rem; margin-bottom:15px; }
    .order-items-table th { text-align:left; padding:10px; border-bottom:1px solid #eee; color:var(--gray); font-size:0.7rem; text-transform:uppercase; }
    .order-items-table td { padding:10px; border-bottom:1px solid #f5f5f5; }

    .empty-state { text-align:center; padding:40px 20px; color:var(--gray); }
    .empty-state i { font-size:2.5rem; color:var(--primary-light); margin-bottom:10px; display:block; }

    .toast-container { position:fixed; bottom:24px; right:24px; z-index:3000; display:flex; flex-direction:column; gap:10px; }
    .toast {
      background:white; color:var(--dark); padding:14px 20px; border-radius:50px;
      box-shadow:0 10px 30px rgba(0,0,0,0.15); display:flex; align-items:center; gap:10px;
      font-weight:500; font-size:0.85rem; animation:slideIn 0.3s ease;
      border-left:4px solid var(--primary); transition:all 0.3s ease;
    }
    .toast.success { border-left-color:var(--success); }
    .toast.error { border-left-color:var(--danger); }
    .toast i { font-size:1.1rem; }

    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); width:280px !important; min-width:280px !important; }
      .sidebar.mobile-open { transform:translateX(0); box-shadow:10px 0 40px rgba(0,0,0,0.3); }
      .sidebar-header .close-sidebar { display:flex !important; }
      .menu-toggle { display:flex !important; }
      .main-content { margin-left:0 !important; width:100% !important; }
      .content-wrapper { padding:16px 12px; }
      .top-bar { padding:0 16px; }
      .page-title { font-size:1.1rem; }
      .current-date { display:none; }
      .stats-grid { grid-template-columns:1fr 1fr; gap:10px; }
      .stat-card { padding:14px 12px; }
      .stat-value { font-size:1.4rem; }
      .panel { padding:16px 12px; border-radius:18px; }
      .data-table { min-width:1000px; }
      .data-table th, .data-table td { padding:10px 6px; font-size:0.75rem; }
      .form-row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-icon">✨</div>
    <div class="logo-text"><span>Omo</span>creations</div>
    <button class="close-sidebar" onclick="closeSidebar()"><i class="fas fa-times"></i></button>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section"><div class="nav-section-title">OVERVIEW</div>
      <button class="nav-item" onclick="navigateTo('admin-dashboard.html')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
      <button class="nav-item" onclick="navigateTo('approvals.html')"><i class="fas fa-check-circle"></i><span>Approvals</span></button>
      <button class="nav-item" onclick="navigateTo('announcements.html')"><i class="fas fa-bullhorn"></i><span>Announcements</span></button>
    </div>
    <div class="nav-section"><div class="nav-section-title">MANAGEMENT</div>
      <button class="nav-item" onclick="navigateTo('staff-management.html')"><i class="fas fa-users-cog"></i><span>Staff Management</span></button>
      <button class="nav-item" onclick="navigateTo('make-admin.html')"><i class="fas fa-user-shield"></i><span>Make Admin</span></button>
      <button class="nav-item" onclick="navigateTo('finance.html')"><i class="fas fa-chart-line"></i><span>Finance</span></button>
      <button class="nav-item" onclick="navigateTo('audit.html')"><i class="fas fa-history"></i><span>Audit Logs</span></button>
    </div>
    <div class="nav-section"><div class="nav-section-title">MONITORING</div>
      <button class="nav-item" onclick="navigateTo('inventory.html')"><i class="fas fa-box"></i><span>Inventory</span></button>
      <button class="nav-item" onclick="navigateTo('purchases.html')"><i class="fas fa-shopping-cart"></i><span>Purchases</span></button>
      <button class="nav-item" onclick="navigateTo('customers.html')"><i class="fas fa-users"></i><span>Customers</span></button>
      <button class="nav-item" onclick="navigateTo('sales.html')"><i class="fas fa-cash-register"></i><span>Sales</span></button>
      <button class="nav-item active"><i class="fas fa-clipboard-list"></i><span>Orders</span></button>
    </div>
    <div class="nav-section"><div class="nav-section-title">SHOP &amp; KIOSK</div>
      <button class="nav-item" onclick="window.open('kiosk.html','_blank')"><i class="fas fa-desktop"></i><span>Launch Kiosk</span></button>
      <button class="nav-item" onclick="navigateTo('kiosk-settings.html')"><i class="fas fa-cog"></i><span>Kiosk Settings</span></button>
      <button class="nav-item" onclick="navigateTo('shop.html')"><i class="fas fa-store"></i><span>Shop</span></button>
      <button class="nav-item" onclick="navigateTo('catalog.html')"><i class="fas fa-book-open"></i><span>Catalog</span></button>
    </div>
    <button class="nav-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
  </nav>
  <div class="sidebar-footer"><div class="user-profile"><div class="user-avatar" id="userAvatar">A</div><div class="user-details"><h4 id="userName">Admin</h4><p id="userRole">Admin</p></div></div></div>
</aside>

<main class="main-content">
  <header class="top-bar">
    <div class="top-bar-left"><button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><h1 class="page-title">Order Management</h1></div>
    <span class="current-date" id="currentDate"></span>
  </header>

  <div class="content-wrapper">

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-header"><span>Total Orders</span><div class="stat-icon"><i class="fas fa-clipboard-list"></i></div></div><div class="stat-value" id="totalOrders">0</div></div>
      <div class="stat-card"><div class="stat-header"><span>Pending</span><div class="stat-icon"><i class="fas fa-clock"></i></div></div><div class="stat-value" id="pendingOrders">0</div></div>
      <div class="stat-card"><div class="stat-header"><span>Processing</span><div class="stat-icon"><i class="fas fa-spinner"></i></div></div><div class="stat-value" id="processingOrders">0</div></div>
      <div class="stat-card"><div class="stat-header"><span>Completed</span><div class="stat-icon"><i class="fas fa-check-circle"></i></div></div><div class="stat-value" id="completedOrders">0</div></div>
    </div>

    <div class="tabs-container">
      <button class="tab active" data-tab="all"><i class="fas fa-list"></i> All <span class="count" id="allCount">0</span></button>
      <button class="tab" data-tab="shop"><i class="fas fa-store"></i> Shop Orders <span class="count" id="shopCount">0</span></button>
      <button class="tab" data-tab="service"><i class="fas fa-tools"></i> Service Orders <span class="count" id="serviceCount">0</span></button>
      <button class="tab" data-tab="manual"><i class="fas fa-hand-paper"></i> Manual Orders <span class="count" id="manualCount">0</span></button>
    </div>

    <div class="filter-bar">
      <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" class="search-input" id="searchInput" placeholder="Search by customer, phone, or receipt..."></div>
      <select class="filter-select" id="statusFilter">
        <option value="all">All Status</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button class="btn btn-primary btn-sm" onclick="openAddOrderModal()"><i class="fas fa-plus"></i> Add Manual Order</button>
    </div>

    <div class="panel">
      <div class="panel-header"><h3><i class="fas fa-clipboard-list"></i> <span id="tableTitle">All Orders</span></h3></div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>Date</th><th>Order #</th><th>Source</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Delivery</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="ordersTable"><tr><td colspan="10"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading orders...</p></div></td></tr></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal"><div class="modal-header"><h3 id="modalTitle">Order</h3><button class="modal-close" onclick="hideModal()">&times;</button></div><div id="modalContent"></div></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI",
    authDomain: "fashion-46e5d.firebaseapp.com",
    projectId: "fashion-46e5d",
    storageBucket: "fashion-46e5d.firebasestorage.app",
    messagingSenderId: "408062284317",
    appId: "1:408062284317:web:eb905bce68926c10a0ecf4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null, userData = null, unsubscribes = [];
  let allShopOrders = [], allServiceOrders = [], allManualOrders = [];
  let currentTab = 'all', currentStatusFilter = 'all';

  function formatDate(d) { if(!d) return '-'; const date=d.toDate?d.toDate():new Date(d); return date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'})+' '+date.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  function formatCurrency(n) { return '₦'+(n||0).toLocaleString(); }
  function navigateTo(url) { window.location.href=url; }
  window.navigateTo = navigateTo;

  function showToast(msg, type='success') {
    const c=document.getElementById('toastContainer'); if(!c) return;
    const t=document.createElement('div'); t.className=`toast ${type}`;
    t.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all 0.3s ease';setTimeout(()=>t.remove(),300);},3500);
  }

  function hideModal() { document.getElementById('modalOverlay').classList.remove('active'); }
  window.hideModal = hideModal;
  function showModal(title, content) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalContent').innerHTML = content;
    document.getElementById('modalOverlay').classList.add('active');
  }
  function cleanup() { unsubscribes.forEach(u=>u()); unsubscribes=[]; }

  window.toggleSidebar = function() {
    const s=document.getElementById('sidebar'), o=document.getElementById('sidebarOverlay');
    if(s.classList.contains('mobile-open')){s.classList.remove('mobile-open');o.classList.remove('active');document.body.style.overflow='';}
    else{s.classList.add('mobile-open');o.classList.add('active');document.body.style.overflow='hidden';}
  };
  window.closeSidebar = function() {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('active'); document.body.style.overflow='';
  };
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar();});

  // ========== LOAD ALL ORDERS ==========
  function loadAllOrders() {
    cleanup();

    // Shop orders
    unsubscribes.push(onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc')),(snap)=>{
      allShopOrders = snap.docs.map(d=>({id:d.id,source:'shop',...d.data()}));
      renderOrders();
    }));

    // Service orders
    unsubscribes.push(onSnapshot(query(collection(db,'service_orders'),orderBy('createdAt','desc')),(snap)=>{
      allServiceOrders = snap.docs.map(d=>({id:d.id,source:'service',...d.data()}));
      renderOrders();
    }));

    // Manual orders
    unsubscribes.push(onSnapshot(query(collection(db,'manual_orders'),orderBy('createdAt','desc')),(snap)=>{
      allManualOrders = snap.docs.map(d=>({id:d.id,source:'manual',...d.data()}));
      renderOrders();
    }));
  }

  function getAllOrders() {
    return [...allShopOrders, ...allServiceOrders, ...allManualOrders].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  }

  function renderOrders() {
    const all = getAllOrders();
    const search = (document.getElementById('searchInput')?.value||'').toLowerCase();

    // Stats
    document.getElementById('totalOrders').textContent = all.length;
    document.getElementById('pendingOrders').textContent = all.filter(o=>o.status==='pending').length;
    document.getElementById('processingOrders').textContent = all.filter(o=>o.status==='processing').length;
    document.getElementById('completedOrders').textContent = all.filter(o=>o.status==='completed').length;

    document.getElementById('allCount').textContent = all.length;
    document.getElementById('shopCount').textContent = allShopOrders.length;
    document.getElementById('serviceCount').textContent = allServiceOrders.length;
    document.getElementById('manualCount').textContent = allManualOrders.length;

    // Filter
    let filtered = [...all];
    if(currentTab==='shop') filtered = [...allShopOrders];
    else if(currentTab==='service') filtered = [...allServiceOrders];
    else if(currentTab==='manual') filtered = [...allManualOrders];

    if(currentStatusFilter!=='all') filtered = filtered.filter(o=>o.status===currentStatusFilter);
    if(search) filtered = filtered.filter(o=>(o.customerName||'').toLowerCase().includes(search)||(o.customerPhone||'').includes(search)||(o.receiptNumber||'').toLowerCase().includes(search));

    const tbody = document.getElementById('ordersTable');
    if(filtered.length===0){tbody.innerHTML='<tr><td colspan="10"><div class="empty-state"><i class="fas fa-clipboard-list"></i><p>No orders found</p></div></td></tr>';return;}

    tbody.innerHTML = filtered.map(o=>{
      const sourceBadge = o.source==='shop'?'badge-info':o.source==='service'?'badge-purple':'badge-warning';
      const sourceLabel = o.source==='shop'?'Shop':o.source==='service'?'Service':'Manual';
      const statusBadge = o.status==='completed'?'badge-success':o.status==='processing'?'badge-info':o.status==='cancelled'?'badge-danger':'badge-warning';
      const total = o.totalAmount || o.items?.reduce((s,i)=>s+(i.price||0)*(i.quantity||0),0) || 0;
      const itemCount = o.items?.length || 1;
      return `<tr>
        <td>${formatDate(o.createdAt)}</td>
        <td><span class="badge badge-info">${o.receiptNumber||'N/A'}</span></td>
        <td><span class="badge ${sourceBadge}">${sourceLabel}</span></td>
        <td><strong>${o.customerName||'-'}</strong></td>
        <td>${o.customerPhone||'-'}</td>
        <td>${itemCount} item${itemCount>1?'s':''}</td>
        <td><strong>${formatCurrency(total)}</strong></td>
        <td>${o.deliveryMethod||o.shippingAddress||'-'}</td>
        <td><span class="badge ${statusBadge}">${o.status||'pending'}</span></td>
        <td>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-sm btn-outline" onclick="viewOrder('${o.id}','${o.source}')"><i class="fas fa-eye"></i></button>
            <button class="btn btn-sm btn-outline" onclick="changeOrderStatus('${o.id}','${o.source}','${o.status||'pending'}')"><i class="fas fa-sync-alt"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // ========== VIEW ORDER ==========
  window.viewOrder = (id,source)=>{
    let order;
    if(source==='shop') order = allShopOrders.find(o=>o.id===id);
    else if(source==='service') order = allServiceOrders.find(o=>o.id===id);
    else order = allManualOrders.find(o=>o.id===id);
    if(!order) return;

    const total = order.totalAmount || order.items?.reduce((s,i)=>s+(i.price||0)*(i.quantity||0),0)||0;
    const itemsHtml = order.items?.length ? order.items.map(i=>`<tr><td>${i.name||'Item'}</td><td>${i.quantity||1}</td><td>${formatCurrency(i.price||0)}</td><td>${formatCurrency((i.price||0)*(i.quantity||1))}</td></tr>`).join('') : '<tr><td colspan="4">No items listed</td></tr>';

    showModal(`Order: ${order.receiptNumber||'N/A'}`,`
      <div class="order-detail-section">
        <h4><i class="fas fa-info-circle"></i> Order Information</h4>
        <p><strong>Source:</strong> <span class="badge badge-${order.source==='shop'?'info':order.source==='service'?'purple':'warning'}">${order.source}</span></p>
        <p><strong>Status:</strong> <span class="badge badge-${order.status==='completed'?'success':order.status==='processing'?'info':order.status==='cancelled'?'danger':'warning'}">${order.status||'pending'}</span></p>
        <p><strong>Date:</strong> ${formatDate(order.createdAt)}</p>
        ${order.serviceName?`<p><strong>Service:</strong> ${order.serviceName}</p>`:''}
        ${order.description?`<p><strong>Description:</strong> ${order.description}</p>`:''}
        ${order.sampleImages?.length?`<p><strong>Images:</strong> ${order.sampleImages.length} uploaded</p>`:''}
      </div>
      <div class="order-detail-section">
        <h4><i class="fas fa-user"></i> Customer</h4>
        <p><strong>Name:</strong> ${order.customerName||'-'}</p>
        <p><strong>Phone:</strong> ${order.customerPhone||'-'}</p>
        <p><strong>Delivery:</strong> ${order.deliveryMethod||order.shippingAddress||'-'}</p>
      </div>
      <div class="order-detail-section">
        <h4><i class="fas fa-box"></i> Items</h4>
        <table class="order-items-table"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>${itemsHtml}<tr><td colspan="3"><strong>Total</strong></td><td><strong>${formatCurrency(total)}</strong></td></tr></table>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" onclick="hideModal()">Close</button>
      </div>
    `);
  };

  // ========== CHANGE STATUS ==========
  window.changeOrderStatus = (id,source,currentStatus)=>{
    const statuses = ['pending','processing','completed','cancelled'];
    const currentIndex = statuses.indexOf(currentStatus);
    const nextStatuses = statuses.filter(s=>s!==currentStatus);

    showModal('Change Order Status',`
      <p style="margin-bottom:15px;">Current: <span class="badge badge-${currentStatus==='completed'?'success':currentStatus==='processing'?'info':currentStatus==='cancelled'?'danger':'warning'}">${currentStatus}</span></p>
      <p style="margin-bottom:15px;font-weight:600;">Select new status:</p>
      <div style="display:grid;gap:10px;">
        ${nextStatuses.map(s=>`<button class="btn btn-${s==='completed'?'success':s==='processing'?'info':s==='cancelled'?'danger':'warning'}" onclick="updateOrderStatus('${id}','${source}','${s}')" style="justify-content:center;padding:14px;"><i class="fas fa-${s==='completed'?'check-circle':s==='processing'?'spinner':s==='cancelled'?'times-circle':'clock'}"></i> ${s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join('')}
      </div>
      <button class="btn btn-outline" onclick="hideModal()" style="width:100%;margin-top:10px;">Cancel</button>
    `);
  };

  window.updateOrderStatus = async (id,source,newStatus)=>{
    const collectionName = source==='shop'?'orders':source==='service'?'service_orders':'manual_orders';
    try {
      await updateDoc(doc(db,collectionName,id),{status:newStatus,updatedAt:serverTimestamp()});
      showToast(`Order marked as ${newStatus}`,'success'); hideModal();
    } catch(e){showToast('Failed: '+e.message,'error');}
  };

  // ========== ADD MANUAL ORDER ==========
  window.openAddOrderModal = ()=>{
    showModal('Add Manual Order',`
      <div class="form-row">
        <div class="form-group"><label>Customer Name *</label><input class="form-control" id="mCustName" placeholder="Full name"></div>
        <div class="form-group"><label>Phone Number *</label><input class="form-control" id="mCustPhone" placeholder="08012345678"></div>
      </div>
      <div class="form-group"><label>Delivery Method</label>
        <select class="form-control" id="mDelivery">
          <option value="pickup">Pick Up</option>
          <option value="waybill">Waybill</option>
        </select>
      </div>
      <div class="form-group"><label>Delivery Address</label><textarea class="form-control" id="mAddress" placeholder="Address"></textarea></div>
      <div class="form-group"><label>Items (one per line: ItemName, Qty, Price)</label><textarea class="form-control" id="mItems" placeholder="Bridal Stones, 2, 5000&#10;Pattern Design, 1, 15000"></textarea></div>
      <div class="form-group"><label>Notes</label><textarea class="form-control" id="mNotes" placeholder="Any additional notes..."></textarea></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="addManualOrder()"><i class="fas fa-plus"></i> Add Order</button>
        <button class="btn btn-outline" onclick="hideModal()">Cancel</button>
      </div>
    `);
  };

  window.addManualOrder = async ()=>{
    const name = document.getElementById('mCustName')?.value?.trim();
    const phone = document.getElementById('mCustPhone')?.value?.trim();
    const delivery = document.getElementById('mDelivery')?.value||'pickup';
    const address = document.getElementById('mAddress')?.value?.trim();
    const notes = document.getElementById('mNotes')?.value?.trim();
    const itemsText = document.getElementById('mItems')?.value?.trim();

    if(!name||!phone){showToast('Name and phone required','error');return;}

    const items = itemsText.split('\n').filter(l=>l.trim()).map(line=>{
      const parts = line.split(',').map(p=>p.trim());
      return {name:parts[0]||'Item',quantity:parseInt(parts[1])||1,price:parseFloat(parts[2])||0};
    });

    const total = items.reduce((s,i)=>s+(i.price*i.quantity),0);
    const receiptNumber = 'MAN-'+Date.now().toString().slice(-8);

    try {
      await addDoc(collection(db,'manual_orders'),{
        customerName:name,customerPhone:phone,deliveryMethod:delivery,
        shippingAddress:address,items,totalAmount:total,
        receiptNumber,status:'pending',notes,
        createdBy:currentUser?.uid,createdByName:userData?.fullName||'Admin',
        createdAt:serverTimestamp()
      });
      showToast('Manual order added!','success'); hideModal();
    } catch(e){showToast('Error: '+e.message,'error');}
  };

  window.refreshData = ()=>{loadAllOrders();showToast('Refreshed','success');};

  document.getElementById('searchInput').addEventListener('input',renderOrders);
  document.getElementById('statusFilter').addEventListener('change',e=>{currentStatusFilter=e.target.value;renderOrders();});

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    this.classList.add('active'); currentTab=this.dataset.tab;
    document.getElementById('tableTitle').textContent = this.textContent.trim() + ' Orders';
    renderOrders();
  }));

  onAuthStateChanged(auth, async (u)=>{
    if(!u){window.location.href='auth.html';return;} currentUser=u;
    try {
      const snap = await getDoc(doc(db,'users',u.uid));
      if(!snap.exists()||(snap.data().role!=='admin'&&snap.data().role!=='super_admin'&&snap.data().role!=='attendant'&&snap.data().role!=='attendant_chief')){await signOut(auth);window.location.href='auth.html';return;}
      userData = snap.data();
      document.getElementById('userName').textContent = userData.fullName?.split(' ')[0]||'Admin';
      document.getElementById('userRole').textContent = userData.role?.replace('_',' ')||'Staff';
      document.getElementById('userAvatar').textContent = (userData.fullName||'A').charAt(0).toUpperCase();
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      loadAllOrders();
    } catch(e){showToast('Error loading','error');}
  });

  document.getElementById('logoutBtn').addEventListener('click',async()=>{await signOut(auth);window.location.href='auth.html';});
  window.addEventListener('beforeunload',cleanup);
</script>
</body>
</html>
