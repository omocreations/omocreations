<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4da6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Notifications · OmoCreations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #ff4da6; --primary-dark: #e6398c; --primary-light: #ffb3d9;
      --primary-soft: #fff0f6; --dark: #1a1a2e; --gray: #6b7280;
      --gray-light: #f3f4f6; --success: #10b981; --warning: #f59e0b;
      --danger: #ef4444; --info: #3b82f6;
      --sidebar-width: 280px; --header-height: 70px;
    }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f9fafb 0%, #fff0f6 100%);
      display: flex; min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes flameRing { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,166,0.4)}50%{box-shadow:0 0 0 10px rgba(255,77,166,0)} }
    @keyframes fadeInUp { from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1} }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1} }

    .sidebar {
      width: var(--sidebar-width); min-width: var(--sidebar-width);
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      color: white; position: fixed; top: 0; left: 0; height: 100vh;
      overflow-y: auto; overflow-x: hidden; transition: transform 0.3s ease; z-index: 1000;
      border-right: 1px solid rgba(255,77,166,0.2);
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    .sidebar-header {
      padding: 24px 18px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,77,166,0.2); position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
    }
    .sidebar-header .close-sidebar {
      display: none; background: rgba(255,255,255,0.1); border: none; color: white;
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      font-size: 1.2rem; margin-left: auto; align-items: center; justify-content: center;
    }
    .logo-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 700; flex-shrink: 0;
      animation: flameRing 2s ease-in-out infinite;
    }
    .logo-text { font-size: 1.25rem; font-weight: 800; font-family: 'Playfair Display', serif; white-space: nowrap; }
    .logo-text span { color: var(--primary); }

    .sidebar-nav { padding: 20px 12px; display: flex; flex-direction: column; }
    .nav-section { margin-bottom: 20px; }
    .nav-section-title {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
      color: rgba(255,255,255,0.4); padding: 8px 14px 6px; font-weight: 600; white-space: nowrap;
    }
    .nav-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: rgba(255,255,255,0.7); cursor: pointer;
      border: none; background: none; width: 100%; font-size: 0.9rem; font-weight: 500;
      text-align: left; margin-bottom: 3px; transition: all 0.2s;
      font-family: 'Poppins', sans-serif; white-space: nowrap; text-decoration: none;
    }
    .nav-item i { width: 22px; font-size: 1.1rem; text-align: center; flex-shrink: 0; }
    .nav-item:hover { background: rgba(255,77,166,0.15); color: white; transform: translateX(5px); }
    .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 5px 15px rgba(255,77,166,0.3); }
    .nav-item.logout { color: rgba(239,68,68,0.7); margin-top: auto; }
    .nav-item.logout:hover { background: rgba(239,68,68,0.15); color: #ef4444; }

    .sidebar-footer {
      padding: 20px; border-top: 1px solid rgba(255,77,166,0.2);
      position: sticky; bottom: 0; background: linear-gradient(0deg, #0f0f1a 0%, transparent 100%);
    }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white; flex-shrink: 0; font-size: 1.1rem;
    }
    .user-details { white-space: nowrap; }
    .user-details h4 { font-size: 0.85rem; font-weight: 600; }
    .user-details p { font-size: 0.7rem; opacity: 0.6; }

    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 999; display: none;
    }
    .sidebar-overlay.active { display: block; }

    .main-content {
      flex: 1; margin-left: var(--sidebar-width); transition: margin-left 0.3s ease;
      min-height: 100vh; width: calc(100% - var(--sidebar-width));
    }

    .top-bar {
      height: var(--header-height); background: rgba(255,255,255,0.98);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 0 28px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,77,166,0.15); position: sticky; top: 0; z-index: 50;
    }
    .top-bar-left { display: flex; align-items: center; gap: 14px; }
    .menu-toggle {
      background: none; border: none; font-size: 1.3rem; color: var(--gray);
      cursor: pointer; padding: 10px; border-radius: 10px; transition: all 0.2s;
      display: none; align-items: center; justify-content: center;
    }
    .menu-toggle:hover { background: var(--primary-soft); color: var(--primary); }
    .page-title { font-size: 1.5rem; font-weight: 700; color: var(--dark); font-family: 'Playfair Display', serif; }
    .current-date { color: var(--gray); font-size: 0.85rem; white-space: nowrap; }

    .content-wrapper { padding: 28px; max-width: 1200px; }

    .panel {
      background: white; border-radius: 24px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid rgba(255,77,166,0.08); margin-bottom: 24px;
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .panel-header h3 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--dark); }
    .panel-header h3 i { color: var(--primary); }

    .notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-card {
      background: white; border-radius: 18px; padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05);
      display: flex; align-items: flex-start; gap: 14px; transition: all 0.2s; cursor: pointer;
    }
    .notif-card:hover { border-color: var(--primary-soft); transform: translateY(-1px); }
    .notif-card.unread { background: var(--primary-soft); border-left: 4px solid var(--primary); }
    .notif-icon {
      width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 1.2rem; flex-shrink: 0;
    }
    .notif-icon.approval { background: rgba(245,158,11,0.1); color: var(--warning); }
    .notif-icon.success { background: rgba(16,185,129,0.1); color: var(--success); }
    .notif-icon.info { background: rgba(59,130,246,0.1); color: var(--info); }
    .notif-icon.danger { background: rgba(239,68,68,0.1); color: var(--danger); }
    .notif-icon.announcement { background: rgba(255,77,166,0.1); color: var(--primary); }
    .notif-content { flex: 1; min-width: 0; }
    .notif-title { font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .notif-message { color: var(--gray); font-size: 0.8rem; margin-bottom: 6px; }
    .notif-time { font-size: 0.7rem; color: var(--gray); display: flex; align-items: center; gap: 5px; }
    .unread-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; flex-shrink: 0; }

    .btn {
      padding: 8px 16px; border-radius: 40px; font-weight: 600; font-size: 0.75rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      background: white; border: 1px solid rgba(0,0,0,0.08); transition: all 0.2s;
      font-family: 'Poppins', sans-serif; white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; }
    .btn-outline { border: 1.5px solid rgba(255,77,166,0.3); color: var(--primary); background: transparent; }
    .btn-sm { padding: 6px 12px; font-size: 0.7rem; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--gray); }
    .empty-state i { font-size: 3rem; color: var(--primary-light); margin-bottom: 16px; display: block; }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: white; color: var(--dark); padding: 14px 20px; border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px;
      font-weight: 500; font-size: 0.85rem; animation: slideIn 0.3s ease;
      border-left: 4px solid var(--primary); transition: all 0.3s ease;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast i { font-size: 1.1rem; }
    .toast.success i { color: var(--success); }
    .toast.error i { color: var(--danger); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: 280px !important; min-width: 280px !important; }
      .sidebar.mobile-open { transform: translateX(0); box-shadow: 10px 0 40px rgba(0,0,0,0.3); }
      .sidebar-header .close-sidebar { display: flex !important; }
      .menu-toggle { display: flex !important; }
      .main-content { margin-left: 0 !important; width: 100% !important; }
      .content-wrapper { padding: 16px 12px; }
      .top-bar { padding: 0 16px; }
      .page-title { font-size: 1.1rem; }
      .current-date { display: none; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-icon">✨</div>
    <div class="logo-text"><span>Omo</span>creations</div>
    <button class="close-sidebar" onclick="closeSidebar()"><i class="fas fa-times"></i></button>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="user-avatar" id="userAvatar">A</div>
      <div class="user-details"><h4 id="userName">Staff</h4><p id="userRole">Loading...</p></div>
    </div>
  </div>
</aside>

<main class="main-content">
  <header class="top-bar">
    <div class="top-bar-left">
      <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <h1 class="page-title">Notifications</h1>
    </div>
    <span class="current-date" id="currentDate"></span>
  </header>

  <div class="content-wrapper">
    <div class="panel">
      <div class="panel-header">
        <h3><i class="fas fa-bell"></i> All Notifications</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="markAllAsRead()"><i class="fas fa-check-double"></i> Mark All Read</button>
          <button class="btn btn-outline btn-sm" onclick="refreshNotifications()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
      </div>
      <div id="notificationsContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading notifications...</p></div>
      </div>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, orderBy, onSnapshot, updateDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI",
    authDomain: "fashion-46e5d.firebaseapp.com",
    projectId: "fashion-46e5d",
    storageBucket: "fashion-46e5d.firebasestorage.app",
    messagingSenderId: "408062284317",
    appId: "1:408062284317:web:eb905bce68926c10a0ecf4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null, userData = null, unsubscribes = [];

  function formatTimeAgo(d) {
    if (!d) return 'Just now';
    const date = d.toDate ? d.toDate() : new Date(d);
    const now = new Date(); const diff = Math.floor((now - date) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff/60)} min ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)} hours ago`;
    return date.toLocaleDateString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }

  function navigateTo(url) { window.location.href = url; }
  window.navigateTo = navigateTo;

  function showToast(msg, type='success') {
    const c = document.getElementById('toastContainer'); if (!c) return;
    const t = document.createElement('div'); t.className = `toast ${type}`;
    t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(100%)'; t.style.transition='all 0.3s ease'; setTimeout(()=>t.remove(),300); }, 3500);
  }

  function cleanup() { unsubscribes.forEach(u=>u()); unsubscribes=[]; }

  function isAdmin() { return userData?.role==='admin'||userData?.role==='super_admin'; }

  window.toggleSidebar = function() {
    const s=document.getElementById('sidebar'), o=document.getElementById('sidebarOverlay');
    if(s.classList.contains('mobile-open')){s.classList.remove('mobile-open');o.classList.remove('active');document.body.style.overflow='';}
    else{s.classList.add('mobile-open');o.classList.add('active');document.body.style.overflow='hidden';}
  };
  window.closeSidebar = function() {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('active'); document.body.style.overflow='';
  };
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar();});

  function buildSidebar() {
    const nav=document.getElementById('sidebarNav'); if(!nav) return;
    const dashboardLink=isAdmin()?'admin-dashboard.html':'attendant-dashboard.html';
    nav.innerHTML=`
      <div class="nav-section"><div class="nav-section-title">OVERVIEW</div>
        <button class="nav-item" onclick="navigateTo('${dashboardLink}')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
        ${isAdmin()?`<button class="nav-item" onclick="navigateTo('approvals.html')"><i class="fas fa-check-circle"></i><span>Approvals</span></button><button class="nav-item" onclick="navigateTo('announcements.html')"><i class="fas fa-bullhorn"></i><span>Announcements</span></button>`:''}
      </div>
      ${isAdmin()?`<div class="nav-section"><div class="nav-section-title">MANAGEMENT</div>
        <button class="nav-item" onclick="navigateTo('staff-management.html')"><i class="fas fa-users-cog"></i><span>Staff Management</span></button>
        <button class="nav-item" onclick="navigateTo('make-admin.html')"><i class="fas fa-user-shield"></i><span>Make Admin</span></button>
        <button class="nav-item" onclick="navigateTo('finance.html')"><i class="fas fa-chart-line"></i><span>Finance</span></button>
        <button class="nav-item" onclick="navigateTo('audit.html')"><i class="fas fa-history"></i><span>Audit Logs</span></button>
      </div>`:''}
      <div class="nav-section"><div class="nav-section-title">MONITORING</div>
        <button class="nav-item" onclick="navigateTo('inventory.html')"><i class="fas fa-box"></i><span>Inventory</span></button>
        <button class="nav-item" onclick="navigateTo('purchases.html')"><i class="fas fa-shopping-cart"></i><span>Purchases</span></button>
        <button class="nav-item" onclick="navigateTo('customers.html')"><i class="fas fa-users"></i><span>Customers</span></button>
        <button class="nav-item" onclick="navigateTo('sales.html')"><i class="fas fa-cash-register"></i><span>Sales</span></button>
        <button class="nav-item" onclick="navigateTo('history.html')"><i class="fas fa-history"></i><span>History</span></button>
        ${isAdmin()?`<button class="nav-item" onclick="navigateTo('orders-admin.html')"><i class="fas fa-clipboard-list"></i><span>Orders Admin</span></button>`:''}
      </div>
      <button class="nav-item active"><i class="fas fa-bell"></i><span>Notifications</span></button>
      ${isAdmin()?`<div class="nav-section"><div class="nav-section-title">SHOP &amp; KIOSK</div>
        <button class="nav-item" onclick="window.open('kiosk.html','_blank')"><i class="fas fa-desktop"></i><span>Launch Kiosk</span></button>
        <button class="nav-item" onclick="navigateTo('kiosk-settings.html')"><i class="fas fa-cog"></i><span>Kiosk Settings</span></button>
        <button class="nav-item" onclick="navigateTo('shop.html')"><i class="fas fa-store"></i><span>Shop</span></button>
        <button class="nav-item" onclick="navigateTo('catalog.html')"><i class="fas fa-book-open"></i><span>Catalog</span></button>
      </div>`:`<button class="nav-item" onclick="navigateTo('attendant-profile.html')"><i class="fas fa-user"></i><span>Profile</span></button>`}
      <button class="nav-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
    `;
    document.getElementById('logoutBtn')?.addEventListener('click',async()=>{await signOut(auth);window.location.href='auth.html';});
  }

  function getIconClass(type) {
    const map = { approved:'success', leave_approved:'success', task_completed:'success', purchase_approved:'success',
      pending_approval:'approval', leave_rejected:'approval', termination_approval:'approval',
      low_stock:'danger', out_of_stock:'danger',
      announcement:'announcement', task_assigned:'info' };
    return map[type] || 'info';
  }

  function getIconName(type) {
    const map = { approved:'user-check', leave_approved:'calendar-check', task_completed:'check-circle', purchase_approved:'shopping-cart',
      pending_approval:'clock', leave_rejected:'calendar-times', termination_approval:'user-slash',
      low_stock:'exclamation-triangle', out_of_stock:'times-circle',
      announcement:'bullhorn', task_assigned:'clipboard-list' };
    return map[type] || 'bell';
  }

  function loadNotifications() {
    if(!currentUser) return;
    cleanup();
    const q = query(collection(db, 'notifications'), where('userId','==',currentUser.uid), orderBy('createdAt','desc'));
    unsubscribes.push(onSnapshot(q, (snap) => {
      const container = document.getElementById('notificationsContainer');
      if(snap.empty){container.innerHTML='<div class="empty-state"><i class="far fa-bell-slash"></i><p>No notifications yet</p></div>';return;}
      let html = '<div class="notif-list">';
      snap.forEach(doc => {
        const n = doc.data(); const ic = getIconClass(n.type); const iname = getIconName(n.type);
        html += `<div class="notif-card ${n.isRead?'':'unread'}" onclick="markAsRead('${doc.id}',${!n.isRead})">
          <div class="notif-icon ${ic}"><i class="fas fa-${iname}"></i></div>
          <div class="notif-content">
            <div class="notif-title">${n.title||'Notification'}${!n.isRead?' <span class="unread-dot"></span>':''}</div>
            <div class="notif-message">${n.message||''}</div>
            <div class="notif-time"><i class="far fa-clock"></i> ${formatTimeAgo(n.createdAt)}</div>
          </div>
        </div>`;
      });
      html += '</div>'; container.innerHTML = html;
    }));
  }

  window.markAsRead = async (id, currentlyUnread) => { if(currentlyUnread){await updateDoc(doc(db,'notifications',id),{isRead:true});} };
  window.markAllAsRead = async () => {
    const snap = await getDocs(query(collection(db,'notifications'),where('userId','==',currentUser.uid),where('isRead','==',false)));
    if(snap.empty){showToast('No unread notifications','info');return;}
    const batch = writeBatch(db); snap.forEach(d=>batch.update(d.ref,{isRead:true})); await batch.commit();
    showToast('All marked as read','success');
  };
  window.refreshNotifications = () => { loadNotifications(); showToast('Refreshed','success'); };

  onAuthStateChanged(auth, async (u) => {
    if(!u){window.location.href='auth.html';return;} currentUser=u;
    try {
      const snap = await getDoc(doc(db,'users',u.uid));
      if(!snap.exists()||snap.data().status!=='active'){await signOut(auth);window.location.href='auth.html';return;}
      userData=snap.data();
      document.getElementById('userName').textContent=userData.fullName?.split(' ')[0]||'Staff';
      document.getElementById('userRole').textContent=userData.role?.replace('_',' ')||'Staff';
      document.getElementById('userAvatar').textContent=(userData.fullName||'A').charAt(0).toUpperCase();
      document.getElementById('currentDate').textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      buildSidebar(); loadNotifications();
    } catch(e){showToast('Error loading','error');}
  });
  window.addEventListener('beforeunload',cleanup);
</script>
</body>
</html>
