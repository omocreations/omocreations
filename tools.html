<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#ff4da6">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #ff4da6; --primary-dark: #e6398c; --primary-light: #ffb3d9;
      --primary-soft: #fff0f6; --dark: #1a1a2e; --gray: #6b7280;
      --gray-light: #f3f4f6; --success: #10b981; --warning: #f59e0b;
      --danger: #ef4444; --info: #3b82f6; --orange: #f97316;
      --sidebar-width: 280px; --header-height: 70px;
    }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f9fafb 0%, #fff0f6 100%);
      display: flex; min-height: 100vh; overflow-x: hidden;

    }

    @keyframes flameRing { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,166,0.4)}50%{box-shadow:0 0 0 10px rgba(255,77,166,0)} }
    @keyframes fadeInUp { from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1} }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1} }

    .sidebar { width: var(--sidebar-width); min-width: var(--sidebar-width); background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%); color: white; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; transition: transform 0.3s ease; z-index: 1000; border-right: 1px solid rgba(255,77,166,0.2); }
    .sidebar::-webkit-scrollbar { width: 4px; } .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); } .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    .sidebar-header { padding: 24px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,77,166,0.2); position: sticky; top: 0; z-index: 10; background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%); }
    .sidebar-header .close-sidebar { display: none; background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; margin-left: auto; align-items: center; justify-content: center; }
    .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; flex-shrink: 0; animation: flameRing 2s ease-in-out infinite; }
    .logo-text { font-size: 1.25rem; font-weight: 800; font-family: 'Playfair Display', serif; white-space: nowrap; } .logo-text span { color: var(--primary); }
    .sidebar-nav { padding: 20px 12px; display: flex; flex-direction: column; } .nav-section { margin-bottom: 20px; }
    .nav-section-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); padding: 8px 14px 6px; font-weight: 600; white-space: nowrap; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; color: rgba(255,255,255,0.7); cursor: pointer; border: none; background: none; width: 100%; font-size: 0.9rem; font-weight: 500; text-align: left; margin-bottom: 3px; transition: all 0.2s; font-family: 'Poppins', sans-serif; white-space: nowrap; text-decoration: none; }
    .nav-item i { width: 22px; font-size: 1.1rem; text-align: center; flex-shrink: 0; } .nav-item:hover { background: rgba(255,77,166,0.15); color: white; transform: translateX(5px); }
    .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 5px 15px rgba(255,77,166,0.3); } .nav-item.logout { color: rgba(239,68,68,0.7); margin-top: auto; } .nav-item.logout:hover { background: rgba(239,68,68,0.15); color: #ef4444; }
    .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,77,166,0.2); position: sticky; bottom: 0; background: linear-gradient(0deg, #0f0f1a 0%, transparent 100%); }
    .user-profile { display: flex; align-items: center; gap: 12px; } .user-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; flex-shrink: 0; font-size: 1.1rem; }
    .user-details { white-space: nowrap; } .user-details h4 { font-size: 0.85rem; font-weight: 600; } .user-details p { font-size: 0.7rem; opacity: 0.6; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; display: none; } .sidebar-overlay.active { display: block; }

    .main-content { flex: 1; margin-left: var(--sidebar-width); transition: margin-left 0.3s ease; min-height: 100vh; width: calc(100% - var(--sidebar-width)); }
    .top-bar { height: var(--header-height); background: rgba(255,255,255,0.98); backdrop-filter: blur(12px); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,77,166,0.15); position: sticky; top: 0; z-index: 50; }
    .top-bar-left { display: flex; align-items: center; gap: 14px; } .menu-toggle { background: none; border: none; font-size: 1.3rem; color: var(--gray); cursor: pointer; padding: 10px; border-radius: 10px; transition: all 0.2s; display: none; align-items: center; justify-content: center; } .menu-toggle:hover { background: var(--primary-soft); color: var(--primary); }
    .page-title { font-size: 1.5rem; font-weight: 700; color: var(--dark); font-family: 'Playfair Display', serif; } .current-date { color: var(--gray); font-size: 0.85rem; white-space: nowrap; }
    .content-wrapper { padding: 28px; max-width: 1400px; width: 100%; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 18px 16px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid rgba(249,115,22,0.1); transition: all 0.3s; animation: fadeInUp 0.5s ease forwards; opacity: 0; }
    .stat-card:nth-child(1){animation-delay:0.05s}.stat-card:nth-child(2){animation-delay:0.10s}.stat-card:nth-child(3){animation-delay:0.15s}.stat-card:nth-child(4){animation-delay:0.20s}
    .stat-card:hover { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(249,115,22,0.15); }
    .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-header span { font-size: 0.65rem; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .stat-icon { width: 36px; height: 36px; border-radius: 12px; background: rgba(249,115,22,0.1); display: flex; align-items: center; justify-content: center; color: var(--orange); }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--dark); font-family: 'Playfair Display', serif; line-height: 1; }
    .stat-change { font-size: 0.65rem; margin-top: 4px; color: var(--gray); }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .search-wrapper { flex: 1; min-width: 200px; position: relative; } .search-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); }
    .search-input { width: 100%; padding: 12px 16px 12px 42px; border: 1.5px solid rgba(0,0,0,0.08); border-radius: 40px; font-size: 0.85rem; outline: none; font-family: 'Poppins', sans-serif; } .search-input:focus { border-color: var(--orange); }
    .filter-select { padding: 12px 20px; border: 1.5px solid rgba(0,0,0,0.08); border-radius: 40px; font-size: 0.85rem; background: white; cursor: pointer; outline: none; font-family: 'Poppins', sans-serif; }

    .panel { background: white; border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid rgba(249,115,22,0.08); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .panel-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 10px; } .panel-header h3 i { color: var(--orange); }

    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 900px; }
    .data-table th { text-align: left; padding: 14px 10px; font-size: 0.7rem; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid rgba(249,115,22,0.15); white-space: nowrap; background: white; }
    .data-table td { padding: 14px 10px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.85rem; }
    .data-table tbody tr { transition: background 0.2s; } .data-table tbody tr:hover { background: rgba(249,115,22,0.03); }
    .data-table tbody tr.sold-row { background: rgba(239,68,68,0.02); }

    .badge { padding: 5px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; display: inline-block; white-space: nowrap; }
    .badge-success { background: rgba(16,185,129,0.1); color: var(--success); } .badge-warning { background: rgba(245,158,11,0.1); color: var(--warning); }
    .badge-danger { background: rgba(239,68,68,0.1); color: var(--danger); } .badge-info { background: rgba(59,130,246,0.1); color: var(--info); }
    .badge-orange { background: rgba(249,115,22,0.1); color: var(--orange); }

    .btn { padding: 8px 16px; border-radius: 40px; font-weight: 600; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: white; border: 1px solid rgba(0,0,0,0.08); transition: all 0.2s; font-family: 'Poppins', sans-serif; white-space: nowrap; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg, var(--orange), #ea580c); color: white; border: none; }
    .btn-outline { border: 1.5px solid rgba(249,115,22,0.3); color: var(--orange); background: transparent; }
    .btn-sm { padding: 6px 12px; font-size: 0.7rem; }
    .btn-success { background: var(--success); color: white; border: none; } .btn-danger { background: var(--danger); color: white; border: none; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 28px; padding: 28px; max-width: 550px; width: 100%; max-height: 85vh; overflow-y: auto; animation: fadeInUp 0.3s ease; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { font-size: 1.2rem; font-weight: 700; } .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray); padding: 5px; transition: all 0.2s; } .modal-close:hover { color: var(--danger); transform: rotate(90deg); }
    .form-group { margin-bottom: 18px; } .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--dark); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 16px; border: 1.5px solid rgba(0,0,0,0.08); border-radius: 14px; font-size: 0.9rem; outline: none; background: white; font-family: 'Poppins', sans-serif; transition: border 0.2s; }
    .form-control:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    textarea.form-control { min-height: 80px; resize: vertical; }

    .pin-input-container { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
    .pin-input { width: 55px; height: 65px; text-align: center; font-size: 1.8rem; font-weight: 700; border: 2px solid rgba(249,115,22,0.2); border-radius: 14px; outline: none; font-family: 'Poppins', sans-serif; } .pin-input:focus { border-color: var(--orange); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--gray); } .empty-state i { font-size: 2.5rem; color: rgba(249,115,22,0.3); margin-bottom: 10px; display: block; }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: white; color: var(--dark); padding: 14px 20px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 0.85rem; animation: slideIn 0.3s ease; border-left: 4px solid var(--orange); transition: all 0.3s ease; }
    .toast.success { border-left-color: var(--success); } .toast.error { border-left-color: var(--danger); } .toast i { font-size: 1.1rem; }

    .receipt-container { background:#f8f9fa; border-radius:12px; padding:20px; font-family:'Courier New',monospace; max-height:50vh; overflow-y:auto; }
    .receipt-header { text-align:center; border-bottom:1px dashed #ccc; padding-bottom:10px; margin-bottom:10px; }
    .receipt-items { margin:15px 0; } .receipt-item { display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px; }
    .receipt-total { border-top:1px dashed #ccc; padding-top:10px; font-weight:bold; font-size:1.1rem; display:flex; justify-content:space-between; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: 280px !important; min-width: 280px !important; }
      .sidebar.mobile-open { transform: translateX(0); box-shadow: 10px 0 40px rgba(0,0,0,0.3); }
      .sidebar-header .close-sidebar { display: flex !important; } .menu-toggle { display: flex !important; }
      .main-content { margin-left: 0 !important; width: 100% !important; } .content-wrapper { padding: 16px 12px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; } .stat-value { font-size: 1.4rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo-icon">✨</div><div class="logo-text"><span>Omo</span>Creations</div><button class="close-sidebar" onclick="closeSidebar()"><i class="fas fa-times"></i></button></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer"><div class="user-profile"><div class="user-avatar" id="userAvatar">A</div><div class="user-details"><h4 id="userName">Staff</h4><p id="userRole">Loading...</p></div></div></div>
</aside>

<main class="main-content">
  <header class="top-bar">
    <div class="top-bar-left"><button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><h1 class="page-title">Tools & Machines</h1></div>
    <span class="current-date" id="currentDate"></span>
  </header>

  <div class="content-wrapper">

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-header"><span>Total Tools</span><div class="stat-icon"><i class="fas fa-tools"></i></div></div><div class="stat-value" id="totalTools">0</div></div>
      <div class="stat-card"><div class="stat-header"><span>Available</span><div class="stat-icon"><i class="fas fa-check-circle"></i></div></div><div class="stat-value" id="availableTools">0</div></div>
      <div class="stat-card"><div class="stat-header"><span>Sold</span><div class="stat-icon"><i class="fas fa-tags"></i></div></div><div class="stat-value" id="soldTools">0</div></div>
      <div class="stat-card"><div class="stat-header"><span>Total Value</span><div class="stat-icon"><i class="fas fa-naira-sign"></i></div></div><div class="stat-value" id="totalValue">₦0</div></div>
    </div>

    <div class="filter-bar">
      <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" class="search-input" id="searchInput" placeholder="Search tools & machines..."></div>
      <select class="filter-select" id="statusFilter"><option value="all">All Status</option><option value="available">Available</option><option value="sold">Sold</option></select>
      <button class="btn btn-outline btn-sm" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button class="btn btn-primary btn-sm" onclick="openAddToolModal()"><i class="fas fa-plus"></i> Add Tool/Machine</button>
    </div>

    <div class="panel">
      <div class="panel-header"><h3><i class="fas fa-tools"></i> Tools & Machines Inventory</h3></div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>Item Name</th><th>Category</th><th>Description</th><th>Price</th><th>Status</th><th>Sold Date</th><th>Sold To</th><th>Actions</th></tr></thead>
          <tbody id="toolsTable"><tr><td colspan="8"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading tools...</p></div></td></tr></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<div class="modal-overlay" id="modalOverlay"><div class="modal"><div class="modal-header"><h3 id="modalTitle">Modal</h3><button class="modal-close" onclick="hideModal()">&times;</button></div><div id="modalContent"></div></div></div>
<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, updateDoc, serverTimestamp, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI", authDomain: "fashion-46e5d.firebaseapp.com", projectId: "fashion-46e5d", storageBucket: "fashion-46e5d.firebasestorage.app", messagingSenderId: "408062284317", appId: "1:408062284317:web:eb905bce68926c10a0ecf4" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  let currentUser = null, userData = null, unsubscribes = [];
  let allTools = [];

  function formatDate(d) { if (!d) return '-'; const date = d.toDate ? d.toDate() : new Date(d); return date.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' }); }
  function formatCurrency(n) { return '₦' + (n || 0).toLocaleString(); }
  function navigateTo(url) { window.location.href = url; }
  window.navigateTo = navigateTo;

  function showToast(msg, type='success') { const c = document.getElementById('toastContainer'); if (!c) return; const t = document.createElement('div'); t.className = `toast ${type}`; t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`; c.appendChild(t); setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(100%)'; t.style.transition='all 0.3s ease'; setTimeout(()=>t.remove(),300); }, 3500); }
  async function logAudit(action, note) { try { await addDoc(collection(db,'audit_logs'),{actionType:action,performedBy:currentUser?.uid||'unknown',performedByName:userData?.fullName||'Staff',performedAt:serverTimestamp(),note:note||''}); } catch(e){} }
  function hideModal() { document.getElementById('modalOverlay').classList.remove('active'); }
  window.hideModal = hideModal;
  function showModal(title, content) { document.getElementById('modalTitle').textContent = title; document.getElementById('modalContent').innerHTML = content; document.getElementById('modalOverlay').classList.add('active'); }
  function cleanup() { unsubscribes.forEach(u=>u()); unsubscribes=[]; }

  window.toggleSidebar = function() { const s=document.getElementById('sidebar'), o=document.getElementById('sidebarOverlay'); if(window.innerWidth<=768){if(s.classList.contains('mobile-open')){s.classList.remove('mobile-open');o.classList.remove('active');document.body.style.overflow='';}else{s.classList.add('mobile-open');o.classList.add('active');document.body.style.overflow='hidden';}} };
  window.closeSidebar = function() { document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('sidebarOverlay').classList.remove('active'); document.body.style.overflow=''; };
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar();});

  function isAdmin() { return userData?.role === 'admin' || userData?.role === 'super_admin'; }

  function buildSidebar() {
    const nav = document.getElementById('sidebarNav'); if(!nav) return;
    const dashboardLink = isAdmin() ? 'admin-dashboard.html' : 'attendant-dashboard.html';
    let navHTML = `<div class="nav-section"><div class="nav-section-title">MAIN</div>
      <button class="nav-item" onclick="navigateTo('${dashboardLink}')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
      <button class="nav-item" onclick="navigateTo('inventory.html')"><i class="fas fa-box"></i><span>Inventory</span></button>
      <button class="nav-item" onclick="navigateTo('store.html')"><i class="fas fa-store"></i><span>Store</span></button>
      <button class="nav-item active"><i class="fas fa-tools"></i><span>Tools & Machines</span></button>
      <button class="nav-item" onclick="navigateTo('sales.html')"><i class="fas fa-cash-register"></i><span>Sales</span></button>
      <button class="nav-item" onclick="navigateTo('purchases.html')"><i class="fas fa-shopping-cart"></i><span>Purchases</span></button>
      <button class="nav-item" onclick="navigateTo('customers.html')"><i class="fas fa-users"></i><span>Customers</span></button></div>`;
    if(isAdmin()){ navHTML+=`<div class="nav-section"><div class="nav-section-title">MANAGEMENT</div>
      <button class="nav-item" onclick="navigateTo('staff-management.html')"><i class="fas fa-users-cog"></i><span>Staff</span></button>
      <button class="nav-item" onclick="navigateTo('approvals.html')"><i class="fas fa-check-circle"></i><span>Approvals</span></button>
      <button class="nav-item" onclick="navigateTo('announcements.html')"><i class="fas fa-bullhorn"></i><span>Announcements</span></button>
      <button class="nav-item" onclick="navigateTo('orders.html')"><i class="fas fa-clipboard-list"></i><span>Orders</span></button>
      <button class="nav-item" onclick="navigateTo('finance.html')"><i class="fas fa-chart-line"></i><span>Finance</span></button>
      <button class="nav-item" onclick="navigateTo('audit.html')"><i class="fas fa-history"></i><span>Audit</span></button></div>
      <div class="nav-section"><div class="nav-section-title">SHOP</div><button class="nav-item" onclick="navigateTo('shop.html')"><i class="fas fa-store"></i><span>Shop</span></button><button class="nav-item" onclick="navigateTo('catalog.html')"><i class="fas fa-book-open"></i><span>Catalog</span></button></div>`; }
    else { navHTML+=`<div class="nav-section"><div class="nav-section-title">WORK</div>
      <button class="nav-item" onclick="navigateTo('tasks.html')"><i class="fas fa-tasks"></i><span>Tasks</span></button>
      <button class="nav-item" onclick="navigateTo('orders.html')"><i class="fas fa-clipboard-list"></i><span>Orders</span></button>
      <button class="nav-item" onclick="navigateTo('announcements.html')"><i class="fas fa-bullhorn"></i><span>Announcements</span></button>
      <button class="nav-item" onclick="navigateTo('notifications.html')"><i class="fas fa-bell"></i><span>Notifications</span></button></div>
      <div class="nav-section"><div class="nav-section-title">ACCOUNT</div><button class="nav-item" onclick="navigateTo('attendant-profile.html')"><i class="fas fa-user"></i><span>My Profile</span></button></div>`; }
    navHTML += `<button class="nav-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>`;
    nav.innerHTML = navHTML;
    document.getElementById('logoutBtn')?.addEventListener('click',async()=>{await signOut(auth);window.location.href='auth.html';});
  }

  function showPinModal(title,action,onSuccess){ showModal(title,`<p style="text-align:center;margin-bottom:20px;">Enter your 4-digit PIN to ${action}</p><div class="pin-input-container"><input type="password" maxlength="1" class="pin-input" id="pin1"><input type="password" maxlength="1" class="pin-input" id="pin2"><input type="password" maxlength="1" class="pin-input" id="pin3"><input type="password" maxlength="1" class="pin-input" id="pin4"></div><button class="btn btn-primary" id="verifyPinBtn" style="width:100%;">Verify</button>`);document.getElementById('pin1').focus();document.querySelectorAll('#modalOverlay .pin-input').forEach((inp,i,arr)=>{inp.addEventListener('input',e=>{if(e.target.value&&i<arr.length-1)arr[i+1].focus();});});document.getElementById('verifyPinBtn').onclick=()=>{const pin=['pin1','pin2','pin3','pin4'].map(id=>document.getElementById(id).value).join('');if(pin===(userData?.attendantPin||'1234')){hideModal();onSuccess();}else{showToast('Invalid PIN','error');}}; }

  function loadTools() {
    cleanup();
    unsubscribes.push(onSnapshot(query(collection(db,'tools_machines'),orderBy('createdAt','desc')),snap=>{
      allTools = snap.docs.map(d=>({id:d.id,...d.data()}));
      renderTools();
    }));
  }

  function renderTools() {
    const search = (document.getElementById('searchInput')?.value||'').toLowerCase();
    const statusFilter = document.getElementById('statusFilter')?.value||'all';
    let filtered = [...allTools];
    if(search) filtered = filtered.filter(t=>(t.name||'').toLowerCase().includes(search)||(t.description||'').toLowerCase().includes(search));
    if(statusFilter!=='all') filtered = filtered.filter(t=>t.status===statusFilter);

    document.getElementById('totalTools').textContent = allTools.length;
    document.getElementById('availableTools').textContent = allTools.filter(t=>t.status==='available').length;
    document.getElementById('soldTools').textContent = allTools.filter(t=>t.status==='sold').length;
    document.getElementById('totalValue').textContent = formatCurrency(allTools.filter(t=>t.status==='available').reduce((s,t)=>s+(t.price||0),0));

    const tbody = document.getElementById('toolsTable');
    if(!filtered.length){ tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><i class="fas fa-tools"></i><p>No tools or machines. Click "Add Tool/Machine" to add one.</p></div></td></tr>'; return; }

    tbody.innerHTML = filtered.map(t => {
      const isSold = t.status === 'sold';
      return `<tr class="${isSold?'sold-row':''}">
        <td><strong>${t.name||'-'}</strong></td>
        <td><span class="badge badge-orange">${t.category||'General'}</span></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.description||'-'}</td>
        <td><strong>${formatCurrency(t.price)}</strong></td>
        <td><span class="badge badge-${isSold?'danger':'success'}">${isSold?'Sold':'Available'}</span></td>
        <td>${isSold?formatDate(t.soldDate):'-'}</td>
        <td>${isSold?(t.soldTo||'Walk-in'):'-'}</td>
        <td><div style="display:flex;gap:4px;">
          ${!isSold?`<button class="btn btn-sm btn-success" onclick="openSellToolModal('${t.id}')"><i class="fas fa-tags"></i> Sell</button>`:''}
          <button class="btn btn-sm btn-outline" onclick="openEditToolModal('${t.id}')"><i class="fas fa-edit"></i></button>
          ${isAdmin()?`<button class="btn btn-sm btn-danger" onclick="deleteTool('${t.id}')"><i class="fas fa-trash"></i></button>`:''}
        </div></td></tr>`;
    }).join('');
  }

  // ========== ADD TOOL ==========
  window.openAddToolModal = function() {
    showModal('Add Tool / Machine', `
      <div class="form-row">
        <div class="form-group"><label>Item Name *</label><input class="form-control" id="toolName" placeholder="e.g., Sewing Machine"></div>
        <div class="form-group"><label>Category</label>
          <select class="form-control" id="toolCategory">
            <option value="Sewing Machine">Sewing Machine</option>
            <option value="Cutting Machine">Cutting Machine</option>
            <option value="Embroidery Machine">Embroidery Machine</option>
            <option value="Heat Press">Heat Press</option>
            <option value="Printer">Printer</option>
            <option value="Hand Tool">Hand Tool</option>
            <option value="Power Tool">Power Tool</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Description</label><textarea class="form-control" id="toolDesc" rows="2" placeholder="Brief description, condition, model..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Price ₦ *</label><input type="number" class="form-control" id="toolPrice" value="0" step="0.01" min="0"></div>
        <div class="form-group"><label>Quantity</label><input type="number" class="form-control" id="toolQty" value="1" min="1"></div>
      </div>
      <button class="btn btn-primary" onclick="addTool()" style="width:100%;"><i class="fas fa-plus"></i> Add Tool/Machine</button>
    `);
  };

  window.addTool = async function() {
    const name = document.getElementById('toolName')?.value?.trim();
    const category = document.getElementById('toolCategory')?.value||'Other';
    const description = document.getElementById('toolDesc')?.value?.trim();
    const price = parseFloat(document.getElementById('toolPrice')?.value)||0;
    const qty = parseInt(document.getElementById('toolQty')?.value)||1;

    if(!name){showToast('Name required','error');return;}
    if(price<=0){showToast('Price required','error');return;}

    try {
      for(let i=0;i<qty;i++){
        await addDoc(collection(db,'tools_machines'),{
          name, category, description, price,
          status: 'available',
          addedBy: currentUser?.uid,
          addedByName: userData?.fullName||'Staff',
          createdAt: serverTimestamp()
        });
      }
      await logAudit('add_tool',`Added ${qty}x ${name} at ${formatCurrency(price)}`);
      showToast(qty>1?`${qty} items added!`:'Tool added!','success');
      hideModal();
    } catch(e){showToast('Failed: '+e.message,'error');}
  };

  // ========== SELL TOOL ==========
  window.openSellToolModal = function(id) {
    const tool = allTools.find(t=>t.id===id); if(!tool)return;
    showModal(`Sell: ${tool.name}`, `
      <div style="background:rgba(249,115,22,0.05);padding:12px;border-radius:12px;margin-bottom:16px;">
        <strong>${tool.name}</strong><br>
        <span style="color:var(--gray);">${tool.category||'General'} | Price: ${formatCurrency(tool.price)}</span>
      </div>
      <div class="form-group"><label>Sell To (Customer Name)</label><input class="form-control" id="sellCustomer" placeholder="Customer name"></div>
      <div class="form-group"><label>Sell Price ₦</label><input type="number" class="form-control" id="sellPrice" value="${tool.price}" step="0.01" min="0"></div>
      <div class="form-group"><label>Notes</label><textarea class="form-control" id="sellNotes" rows="2" placeholder="Any notes..."></textarea></div>
      <button class="btn btn-success" onclick="confirmSellTool('${id}')" style="width:100%;"><i class="fas fa-check"></i> Confirm Sale</button>
    `);
  };

  window.confirmSellTool = async function(id) {
    const customer = document.getElementById('sellCustomer')?.value?.trim()||'Walk-in';
    const price = parseFloat(document.getElementById('sellPrice')?.value)||0;
    const notes = document.getElementById('sellNotes')?.value?.trim();

    showPinModal('Confirm Sale','sell this tool/machine',async()=>{
      try {
        await updateDoc(doc(db,'tools_machines',id),{
          status: 'sold',
          soldTo: customer,
          soldPrice: price,
          soldDate: serverTimestamp(),
          soldBy: currentUser?.uid,
          soldByName: userData?.fullName||'Staff',
          saleNotes: notes
        });
        await logAudit('sell_tool',`Sold tool to ${customer} for ${formatCurrency(price)}`);
        showToast('Tool sold!','success'); hideModal();
      } catch(e){showToast('Failed: '+e.message,'error');}
    });
  };

  // ========== EDIT TOOL ==========
  window.openEditToolModal = function(id) {
    const tool = allTools.find(t=>t.id===id); if(!tool)return;
    showModal(`Edit: ${tool.name}`, `
      <div class="form-row">
        <div class="form-group"><label>Item Name</label><input class="form-control" id="editName" value="${tool.name||''}"></div>
        <div class="form-group"><label>Category</label>
          <select class="form-control" id="editCategory">
            ${['Sewing Machine','Cutting Machine','Embroidery Machine','Heat Press','Printer','Hand Tool','Power Tool','Other'].map(c=>`<option value="${c}" ${tool.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group"><label>Description</label><textarea class="form-control" id="editDesc" rows="2">${tool.description||''}</textarea></div>
      <div class="form-group"><label>Price ₦</label><input type="number" class="form-control" id="editPrice" value="${tool.price||0}" step="0.01" min="0"></div>
      <div style="display:flex;gap:10px;"><button class="btn btn-primary" onclick="saveEditTool('${id}')"><i class="fas fa-save"></i> Save</button><button class="btn btn-outline" onclick="hideModal()">Cancel</button></div>
    `);
  };

  window.saveEditTool = async function(id) {
    const name = document.getElementById('editName')?.value?.trim();
    if(!name){showToast('Name required','error');return;}
    try {
      await updateDoc(doc(db,'tools_machines',id),{
        name,
        category: document.getElementById('editCategory')?.value,
        description: document.getElementById('editDesc')?.value?.trim(),
        price: parseFloat(document.getElementById('editPrice')?.value)||0,
        updatedAt: serverTimestamp()
      });
      showToast('Updated','success'); hideModal();
    } catch(e){showToast('Failed','error');}
  };

  window.deleteTool = async function(id) {
    if(!confirm('Delete this tool permanently?'))return;
    try { await deleteDoc(doc(db,'tools_machines',id)); showToast('Deleted','success'); } catch(e){showToast('Failed','error');}
  };

  window.refreshData = ()=>{loadTools();showToast('Refreshed','success');};

  document.getElementById('searchInput').addEventListener('input',renderTools);
  document.getElementById('statusFilter').addEventListener('change',renderTools);

  onAuthStateChanged(auth,async(u)=>{
    if(!u){window.location.href='auth.html';return;} currentUser=u;
    try {
      const snap = await getDoc(doc(db,'users',u.uid));
      if(!snap.exists()||snap.data().status!=='active'){await signOut(auth);window.location.href='auth.html';return;}
      userData = snap.data();
      document.getElementById('userName').textContent = userData.fullName?.split(' ')[0]||'Staff';
      document.getElementById('userRole').textContent = userData.role?.replace('_',' ')||'Staff';
      document.getElementById('userAvatar').textContent = (userData.fullName||'A').charAt(0).toUpperCase();
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      buildSidebar(); loadTools();
    } catch(e){showToast('Error','error');}
  });
  window.addEventListener('beforeunload',cleanup);
</script>
</body>
</html>
