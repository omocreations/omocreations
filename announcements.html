<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4da6">
  <title>Announcements · OmoCreations</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root { 
      --primary: #ff4da6; 
      --primary-dark: #e6398c; 
      --primary-light: #ffb3d9;
      --primary-soft: #fff0f6; 
      --dark: #1a1a2e; 
      --gray: #6b7280; 
      --gray-light: #f3f4f6; 
      --success: #10b981; 
      --warning: #f59e0b; 
      --danger: #ef4444; 
      --info: #3b82f6; 
      --sidebar-width: 280px; 
      --sidebar-collapsed: 80px; 
      --header-height: 70px; 
    }
    
    body { 
      font-family: 'Poppins', sans-serif; 
      background: linear-gradient(135deg, #f9fafb 0%, #fff0f6 100%);
      display: flex; 
      min-height: 100vh; 
    }
    
    /* Flame Ring Animation */
    @keyframes flameRing {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 166, 0.4); }
      50% { box-shadow: 0 0 0 5px rgba(255, 77, 166, 0.2); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 166, 0); }
    }
    
    /* Sidebar with Gradient Background matching homepage */
    .sidebar { 
      width: var(--sidebar-width); 
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%); 
      color: white; 
      position: fixed; 
      height: 100vh; 
      overflow-y: auto; 
      transition: transform 0.3s ease, width 0.25s ease; 
      z-index: 1000; 
      border-right: 1px solid rgba(255, 77, 166, 0.2);
    }
    
    /* Mobile sidebar - hidden by default */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
    }
    
    /* Desktop collapsed sidebar */
    @media (min-width: 769px) {
      .sidebar.collapsed { 
        width: var(--sidebar-collapsed); 
      }
    }
    
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    
    .sidebar-header { 
      padding: 24px 18px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,77,166,0.2);
    }
    
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon { 
      width: 42px; 
      height: 42px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem; 
      font-weight: 700;
      animation: flameRing 2s ease-in-out infinite;
    }
    
    .logo-text { 
      font-size: 1.25rem; 
      font-weight: 800; 
      font-family: 'Playfair Display', serif;
      white-space: nowrap;
    } 
    
    .logo-text span { color: var(--primary); }
    
    .close-sidebar {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    
    .close-sidebar:hover {
      background: var(--primary);
      transform: rotate(90deg);
    }
    
    @media (max-width: 768px) {
      .close-sidebar {
        display: flex;
      }
    }
    
    .sidebar.collapsed .logo-text, 
    .sidebar.collapsed .nav-text, 
    .sidebar.collapsed .user-details, 
    .sidebar.collapsed .nav-section-title { display: none; }
    
    .sidebar-nav { 
      padding: 20px 12px; 
      display: flex; 
      flex-direction: column; 
      height: calc(100vh - 100px); 
      overflow-y: auto; 
    }
    
    .nav-section { margin-bottom: 24px; }
    
    .nav-section-title { 
      font-size: 0.7rem; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: rgba(255,255,255,0.4); 
      margin-bottom: 10px; 
      padding-left: 14px; 
      font-weight: 600; 
    }
    
    .nav-item { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      padding: 12px 14px; 
      border-radius: 12px; 
      color: rgba(255,255,255,0.7); 
      cursor: pointer; 
      border: none; 
      background: none; 
      width: 100%; 
      font-size: 0.9rem; 
      font-weight: 500; 
      text-align: left; 
      margin-bottom: 3px; 
      transition: all 0.2s; 
      font-family: 'Poppins', sans-serif;
    }
    
    .nav-item i { width: 22px; font-size: 1.1rem; }
    
    .nav-item:hover { 
      background: rgba(255,77,166,0.15); 
      color: white; 
      transform: translateX(5px);
    }
    
    .nav-item.active { 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      color: white; 
      box-shadow: 0 5px 15px rgba(255,77,166,0.3);
    }
    
    .nav-item.logout { 
      color: rgba(239,68,68,0.7); 
      margin-top: auto; 
    }
    
    .nav-item.logout:hover {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
    }
    
    .sidebar-footer { 
      padding: 20px 16px; 
      border-top: 1px solid rgba(255,77,166,0.2); 
      margin-top: auto;
    }
    
    /* Sidebar Overlay for Mobile */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }
    
    .sidebar-overlay.active {
      display: block;
    }
    
    .user-profile { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    }
    
    .user-avatar { 
      width: 44px; 
      height: 44px; 
      border-radius: 12px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 700; 
      color: white; 
      font-size: 1.1rem;
    }
    
    .user-details h4 { font-size: 0.85rem; font-weight: 600; } 
    .user-details p { font-size: 0.7rem; opacity: 0.6; }
    
    /* Main content */
    .main-content { 
      flex: 1; 
      margin-left: var(--sidebar-width); 
      transition: margin-left 0.25s ease; 
      min-height: 100vh; 
      width: calc(100% - var(--sidebar-width)); 
    }
    
    @media (max-width: 768px) {
      .main-content { 
        margin-left: 0 !important; 
        width: 100% !important; 
      }
    }
    
    @media (min-width: 769px) {
      .sidebar.collapsed + .main-content { 
        margin-left: var(--sidebar-collapsed); 
        width: calc(100% - var(--sidebar-collapsed)); 
      }
    }
    
    /* Top Bar */
    .top-bar { 
      height: var(--header-height); 
      background: rgba(255,255,255,0.98); 
      backdrop-filter: blur(12px); 
      padding: 0 28px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      border-bottom: 1px solid rgba(255,77,166,0.15);
      position: sticky; 
      top: 0; 
      z-index: 50; 
    }
    
    .top-bar-left { 
      display: flex; 
      align-items: center; 
      gap: 18px; 
    }
    
    .menu-toggle { 
      background: none; 
      border: none; 
      font-size: 1.2rem; 
      color: var(--gray); 
      cursor: pointer; 
      padding: 10px; 
      border-radius: 10px; 
      transition: all 0.2s;
    }
    
    .menu-toggle:hover { 
      background: var(--primary-soft); 
      color: var(--primary); 
      transform: scale(1.05);
    }
    
    .page-title { 
      font-size: 1.5rem; 
      font-weight: 700; 
      color: var(--dark); 
      font-family: 'Playfair Display', serif;
    }
    
    .content-wrapper { 
      padding: 28px; 
      max-width: 1400px; 
    }
    
    /* Panels */
    .panel { 
      background: white; 
      border-radius: 24px; 
      padding: 24px; 
      margin-bottom: 24px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
      border: 1px solid rgba(255,77,166,0.08);
      transition: all 0.3s;
    }
    
    .panel:hover {
      box-shadow: 0 8px 25px rgba(255,77,166,0.08);
    }
    
    .panel-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .panel-header h3 { 
      font-size: 1.1rem; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      color: var(--dark);
    }
    
    .panel-header h3 i { color: var(--primary); }
    
    /* Form Elements */
    .form-group { margin-bottom: 18px; }
    .form-group label { 
      display: block; 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: var(--dark); 
      margin-bottom: 6px; 
    }
    
    .form-control { 
      width: 100%; 
      padding: 12px 16px; 
      border: 1.5px solid rgba(0,0,0,0.08); 
      border-radius: 14px; 
      font-size: 0.9rem; 
      outline: none; 
      background: white; 
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s;
    }
    
    .form-control:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 3px rgba(255,77,166,0.1);
    }
    
    textarea.form-control { min-height: 100px; resize: vertical; }
    
    /* Target Options */
    .target-options { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      margin-bottom: 15px; 
    }
    
    .target-option { 
      padding: 10px 20px; 
      border: 1.5px solid rgba(0,0,0,0.08); 
      border-radius: 40px; 
      cursor: pointer; 
      font-size: 0.85rem; 
      background: white;
      transition: all 0.2s;
    }
    
    .target-option:hover { border-color: var(--primary); }
    .target-option.selected { 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      color: white; 
      border-color: var(--primary); 
    }
    
    .user-select-list { 
      max-height: 200px; 
      overflow-y: auto; 
      border: 1.5px solid rgba(0,0,0,0.08); 
      border-radius: 14px; 
      padding: 10px; 
      margin-top: 10px; 
      display: none; 
    }
    
    .user-select-item { 
      padding: 8px 12px; 
      cursor: pointer; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      gap: 10px;
      transition: all 0.2s;
    }
    
    .user-select-item:hover { background: var(--primary-soft); }
    .user-select-item.selected { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
    
    /* Tables */
    .table-wrapper { overflow-x: auto; border-radius: 16px; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .data-table th { 
      text-align: left; 
      padding: 14px 12px; 
      font-size: 0.7rem; 
      font-weight: 600; 
      color: var(--gray); 
      text-transform: uppercase; 
      letter-spacing: 1px;
      border-bottom: 2px solid var(--primary-soft); 
    }
    .data-table td { 
      padding: 14px 12px; 
      border-bottom: 1px solid rgba(0,0,0,0.04); 
      font-size: 0.85rem; 
    }
    
    /* Badges */
    .badge { 
      padding: 5px 12px; 
      border-radius: 40px; 
      font-size: 0.7rem; 
      font-weight: 600; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
    }
    .badge-success { background: rgba(16,185,129,0.1); color: var(--success); }
    .badge-warning { background: rgba(245,158,11,0.1); color: var(--warning); }
    .badge-info { background: rgba(59,130,246,0.1); color: var(--info); }
    
    /* Buttons */
    .btn { 
      padding: 8px 16px; 
      border-radius: 40px; 
      font-weight: 600; 
      font-size: 0.75rem; 
      border: none; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      background: white; 
      border: 1px solid rgba(0,0,0,0.08); 
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      color: white; 
      border: none;
    }
    .btn-danger { background: var(--danger); color: white; border: none; }
    .btn-outline { 
      border: 1.5px solid rgba(255,77,166,0.3); 
      color: var(--primary); 
      background: transparent; 
    }
    .btn-sm { padding: 6px 12px; font-size: 0.7rem; }
    
    /* Empty State */
    .empty-state { 
      text-align: center; 
      padding: 40px; 
      color: var(--gray); 
    }
    .empty-state i { font-size: 2.5rem; color: var(--primary-light); margin-bottom: 10px; }
    
    /* Tabs */
    .tabs-container { 
      display: flex; 
      gap: 6px; 
      margin-bottom: 24px; 
      background: var(--gray-light); 
      padding: 6px; 
      border-radius: 40px; 
    }
    
    .tab-btn { 
      padding: 10px 20px; 
      border-radius: 40px; 
      font-weight: 600; 
      font-size: 0.85rem; 
      border: none; 
      background: none; 
      color: var(--gray); 
      cursor: pointer; 
      flex: 1;
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
    }
    
    .tab-btn.active { 
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
      color: white; 
    }
    
    .tab-content { display: none; } 
    .tab-content.active { display: block; }
    
    /* Toast */
    .toast-container { 
      position: fixed; 
      bottom: 24px; 
      right: 24px; 
      z-index: 9999; 
    }
    
    .toast { 
      background: white; 
      padding: 14px 20px; 
      border-radius: 50px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.12); 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      transform: translateX(400px); 
      transition: transform 0.25s; 
      border-left: 4px solid var(--primary); 
      margin-top: 10px;
    }
    
    .toast.show { transform: translateX(0); }
    
    /* Responsive */
    @media (max-width: 992px) { 
      .sidebar { width: var(--sidebar-collapsed); } 
      .sidebar .logo-text, .sidebar .nav-text, .sidebar .user-details, .sidebar .nav-section-title { display: none; } 
      .main-content { margin-left: var(--sidebar-collapsed); } 
    }
    @media (max-width: 768px) { 
      .content-wrapper { padding: 16px; } 
      .top-bar { padding: 0 16px; }
      .page-title { font-size: 1.2rem; }
      .tabs-container { flex-wrap: wrap; }
      .tab-btn { padding: 6px 12px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-area">
      <div class="logo-icon">✨</div>
      <div class="logo-text"><span>Omo</span>creations</div>
    </div>
    <button class="close-sidebar" onclick="closeSidebar()">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-title">OVERVIEW</div>
      <button class="nav-item" onclick="window.location.href='admin-dashboard.html'">
        <i class="fas fa-chart-pie"></i><span class="nav-text">Dashboard</span>
      </button>
      <button class="nav-item" onclick="window.location.href='approvals.html'">
        <i class="fas fa-check-circle"></i><span class="nav-text">Approvals</span>
      </button>
      <button class="nav-item active" onclick="window.location.href='announcements.html'">
        <i class="fas fa-bullhorn"></i><span class="nav-text">Announcements</span>
      </button>
    </div>
    
    <div class="nav-section">
      <div class="nav-section-title">MANAGEMENT</div>
      <button class="nav-item" onclick="window.location.href='staff-management.html'">
        <i class="fas fa-users-cog"></i><span class="nav-text">Staff Management</span>
      </button>
      <button class="nav-item" onclick="window.location.href='finance.html'">
        <i class="fas fa-chart-line"></i><span class="nav-text">Finance</span>
      </button>
      <button class="nav-item" onclick="window.location.href='audit.html'">
        <i class="fas fa-history"></i><span class="nav-text">Audit Logs</span>
      </button>
    </div>
    
    <div class="nav-section">
      <div class="nav-section-title">MONITORING</div>
      <button class="nav-item" onclick="window.location.href='inventory.html'">
        <i class="fas fa-box"></i><span class="nav-text">Inventory</span>
      </button>
      <button class="nav-item" onclick="window.location.href='purchases.html'">
        <i class="fas fa-shopping-cart"></i><span class="nav-text">Purchases</span>
      </button>
      <button class="nav-item" onclick="window.location.href='customers.html'">
        <i class="fas fa-users"></i><span class="nav-text">Customers</span>
      </button>
      <button class="nav-item" onclick="window.location.href='sales.html'">
        <i class="fas fa-cash-register"></i><span class="nav-text">Sales</span>
      </button>
    </div>
    
    <button class="nav-item logout" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i><span class="nav-text">Logout</span>
    </button>
  </nav>
  
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="user-avatar" id="userAvatar">A</div>
      <div class="user-details">
        <h4 id="userName">Admin</h4>
        <p id="userRole">Administrator</p>
      </div>
    </div>
  </div>
</aside>

<!-- Main Content -->
<main class="main-content">
  <header class="top-bar">
    <div class="top-bar-left">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <h1 class="page-title">Announcements</h1>
    </div>
    <div style="color:var(--gray); font-size:0.85rem;">
      <span id="currentDate"></span>
    </div>
  </header>
  
  <div class="content-wrapper">
    
    <div class="tabs-container">
      <button class="tab-btn active" data-tab="create"><i class="fas fa-plus-circle"></i> Create</button>
      <button class="tab-btn" data-tab="sent"><i class="fas fa-paper-plane"></i> Sent</button>
      <button class="tab-btn" data-tab="replies"><i class="fas fa-reply-all"></i> Replies</button>
    </div>
    
    <!-- Create Tab -->
    <div id="createTab" class="tab-content active">
      <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-bullhorn"></i> Create Announcement</h3></div>
        <div class="form-group"><label>Title</label><input class="form-control" id="announcementTitle" placeholder="e.g., Staff Meeting"></div>
        <div class="form-group"><label>Message</label><textarea class="form-control" id="announcementMessage" placeholder="Your announcement..."></textarea></div>
        <div class="form-group"><label>Send To</label>
          <div class="target-options">
            <div class="target-option selected" data-target="all"><i class="fas fa-globe"></i> Everyone</div>
            <div class="target-option" data-target="workers"><i class="fas fa-users"></i> Workers Only</div>
            <div class="target-option" data-target="attendants"><i class="fas fa-user-tie"></i> Attendants Only</div>
            <div class="target-option" data-target="specific"><i class="fas fa-user"></i> Specific People</div>
          </div>
        </div>
        <div class="form-group"><label>Require Acknowledgment</label>
          <select class="form-control" id="requireAck">
            <option value="false">No - Just inform</option>
            <option value="true">Yes - Require staff to acknowledge</option>
          </select>
        </div>
        <div class="user-select-list" id="userSelectList"></div>
        <button class="btn btn-primary" onclick="sendAnnouncement()"><i class="fas fa-paper-plane"></i> Send Announcement</button>
      </div>
    </div>
    
    <!-- Sent Tab -->
    <div id="sentTab" class="tab-content">
      <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-history"></i> Sent Announcements</h3><button class="btn btn-outline btn-sm" onclick="refreshAnnouncements()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
        <div class="table-wrapper"><table class="data-table"><thead><tr><th>Title</th><th>Message</th><th>Sent To</th><th>Sent By</th><th>Acknowledged</th><th>Date</th><th>Actions</th></tr></thead><tbody id="announcementsTable"></tbody></table></div>
      </div>
    </div>
    
    <!-- Replies Tab -->
    <div id="repliesTab" class="tab-content">
      <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-reply-all"></i> Replies & Acknowledgments</h3></div>
        <div class="table-wrapper"><table class="data-table"><thead><tr><th>Announcement</th><th>From</th><th>Type</th><th>Message</th><th>Time</th></tr></thead><tbody id="repliesTable"></tbody></table></div>
      </div>
    </div>
    
  </div>
</main>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, getDocs, where, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI", authDomain: "fashion-46e5d.firebaseapp.com", projectId: "fashion-46e5d", storageBucket: "fashion-46e5d.firebasestorage.app", messagingSenderId: "408062284317", appId: "1:408062284317:web:eb905bce68926c10a0ecf4" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
  let currentUser = null, userData = null, unsubscribes = [], selectedTarget = 'all', selectedUsers = new Set(), allStaff = [], allAnnouncements = [];

  function formatDateTime(d) { if (!d) return '-'; const date = d.toDate ? d.toDate() : new Date(d); return date.toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  function showToast(msg, type='success') { const c = document.getElementById('toastContainer'); const t = document.createElement('div'); t.className = `toast ${type}`; t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i><span>${msg}</span>`; c.appendChild(t); setTimeout(() => t.classList.add('show'), 10); setTimeout(() => t.remove(), 4000); }

  // Sidebar functions
  window.toggleSidebar = function() { 
    const sidebar = document.getElementById('sidebar'); 
    const overlay = document.getElementById('sidebarOverlay'); 
    if (window.innerWidth <= 768) { 
      sidebar.classList.add('mobile-open'); 
      overlay.classList.add('active'); 
    } else { 
      sidebar.classList.toggle('collapsed'); 
    } 
  };
  
  window.closeSidebar = function() { 
    const sidebar = document.getElementById('sidebar'); 
    const overlay = document.getElementById('sidebarOverlay'); 
    sidebar.classList.remove('mobile-open'); 
    overlay.classList.remove('active'); 
    if (window.innerWidth > 768) {
      sidebar.classList.add('collapsed');
    }
  };

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(t => t.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(this.dataset.tab + 'Tab').classList.add('active');
  }));

  document.querySelectorAll('.target-option').forEach(opt => opt.addEventListener('click', function() { 
    document.querySelectorAll('.target-option').forEach(o => o.classList.remove('selected')); 
    this.classList.add('selected'); 
    selectedTarget = this.dataset.target; 
    document.getElementById('userSelectList').style.display = selectedTarget === 'specific' ? 'block' : 'none'; 
  }));

  async function loadStaffList() { 
    const snap = await getDocs(query(collection(db, 'users'), where('role', 'in', ['staff','attendant','attendant_chief']), where('status', '==', 'active'))); 
    allStaff = snap.docs.map(d => ({id:d.id, ...d.data()})); 
    renderUserList(); 
  }
  
  function renderUserList() { 
    const list = document.getElementById('userSelectList'); list.innerHTML = ''; 
    allStaff.forEach(s => { 
      const div = document.createElement('div'); 
      div.className = `user-select-item ${selectedUsers.has(s.id)?'selected':''}`; 
      div.innerHTML = `<input type="checkbox" ${selectedUsers.has(s.id)?'checked':''} style="accent-color:var(--primary); margin-right:8px;"> <span>${s.fullName} (${s.role})</span>`; 
      div.querySelector('input').addEventListener('change', e => { if (e.target.checked) selectedUsers.add(s.id); else selectedUsers.delete(s.id); div.classList.toggle('selected'); }); 
      div.addEventListener('click', (e) => { if (e.target.tagName !== 'INPUT') { const cb = div.querySelector('input'); cb.checked = !cb.checked; if (cb.checked) selectedUsers.add(s.id); else selectedUsers.delete(s.id); div.classList.toggle('selected'); } }); 
      list.appendChild(div); 
    }); 
  }

  window.sendAnnouncement = async () => {
    const title = document.getElementById('announcementTitle').value.trim(), message = document.getElementById('announcementMessage').value.trim();
    const requireAck = document.getElementById('requireAck').value === 'true';
    if (!title || !message) { showToast('Title and message required', 'error'); return; }
    let recipientIds = []; let targetDescription = '';
    
    if (selectedTarget === 'all') { 
      const snap = await getDocs(query(collection(db, 'users'), where('role', 'in', ['staff','attendant','attendant_chief']), where('status', '==', 'active'))); 
      recipientIds = snap.docs.map(d => d.id); targetDescription = 'Everyone'; 
    } else if (selectedTarget === 'workers') { 
      const snap = await getDocs(query(collection(db, 'users'), where('role', '==', 'staff'), where('status', '==', 'active'))); 
      recipientIds = snap.docs.map(d => d.id); targetDescription = 'Workers Only'; 
    } else if (selectedTarget === 'attendants') { 
      const snap = await getDocs(query(collection(db, 'users'), where('role', 'in', ['attendant','attendant_chief']), where('status', '==', 'active'))); 
      recipientIds = snap.docs.map(d => d.id); targetDescription = 'Attendants Only'; 
    } else { 
      recipientIds = Array.from(selectedUsers); targetDescription = `${recipientIds.length} specific people`; 
    }
    
    if (recipientIds.length === 0) { showToast('No recipients selected', 'error'); return; }
    
    await addDoc(collection(db, 'announcements'), { 
      title, message, target: selectedTarget, targetDescription, recipientIds, 
      requireAcknowledgment: requireAck, sentBy: currentUser.uid, sentByName: userData.fullName, 
      createdAt: serverTimestamp(), acknowledgedBy: [], readBy: [] 
    });
    
    const batch = writeBatch(db); 
    recipientIds.forEach(id => { const ref = doc(collection(db, 'notifications')); batch.set(ref, { userId: id, type: 'announcement', title, message, isRead: false, createdAt: serverTimestamp() }); }); 
    await batch.commit();
    
    showToast(`Announcement sent to ${recipientIds.length} people`, 'success'); 
    document.getElementById('announcementTitle').value = ''; 
    document.getElementById('announcementMessage').value = ''; 
    selectedUsers.clear(); 
    renderUserList();
  };

  function loadAnnouncements() { 
    unsubscribes.forEach(u => u()); unsubscribes = []; 
    unsubscribes.push(onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc')), snap => { 
      allAnnouncements = snap.docs.map(d => ({id: d.id, ...d.data()}));
      const tbody = document.getElementById('announcementsTable'); tbody.innerHTML = ''; 
      if (snap.empty) tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-bullhorn"></i><p>No announcements sent yet</p></div>NonNull</td></tr>'; 
      else snap.forEach(d => { 
        const a = d.data(); 
        const ackCount = a.acknowledgedBy?.length || 0;
        const totalRecipients = a.recipientIds?.length || 0;
        tbody.innerHTML += `<tr>
          <td><strong>${a.title}</strong></td>
          <td>${a.message.substring(0,40)}...</td>
          <td>${a.targetDescription}</td>
          <td>${a.sentByName}</td>
          <td><span class="badge ${ackCount === totalRecipients ? 'badge-success' : 'badge-warning'}">${ackCount}/${totalRecipients}</span></td>
          <td>${formatDateTime(a.createdAt)}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteAnnouncement('${d.id}')"><i class="fas fa-trash"></i></button></td>
        </tr>`; 
      }); 
    })); 
    
    unsubscribes.push(onSnapshot(query(collection(db, 'announcement_replies'), orderBy('createdAt', 'desc')), snap => {
      const tbody = document.getElementById('repliesTable'); tbody.innerHTML = '';
      if (snap.empty) tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><i class="fas fa-reply-all"></i><p>No replies yet</p></div>NonNull<td></tr>';
      else snap.forEach(d => {
        const r = d.data();
        tbody.innerHTML += `<tr>
          <td>${r.announcementTitle}</td>
          <td>${r.userName}</td>
          <td><span class="badge ${r.type==='acknowledgment'?'badge-success':'badge-info'}">${r.type}</span></td>
          <td>${r.message || 'Acknowledged'}</td>
          <td>${formatDateTime(r.createdAt)}</td>
        </tr>`;
      });
    }));
  }
  
  window.deleteAnnouncement = async (id) => { if (!confirm('Delete this announcement?')) return; await deleteDoc(doc(db, 'announcements', id)); showToast('Deleted', 'success'); };
  window.refreshAnnouncements = () => loadAnnouncements();

  onAuthStateChanged(auth, async (u) => { 
    if (!u) { window.location.href = 'auth.html'; return; } 
    currentUser = u; 
    const snap = await getDoc(doc(db, 'users', u.uid)); 
    if (!snap.exists() || (snap.data().role !== 'admin' && snap.data().role !== 'super_admin')) { 
      await signOut(auth);
      window.location.href = 'auth.html'; 
      return; 
    }
    userData = snap.data(); 
    document.getElementById('userName').textContent = userData.fullName?.split(' ')[0] || 'Admin'; 
    document.getElementById('userRole').textContent = userData.role === 'super_admin' ? 'Super Admin' : 'Admin'; 
    document.getElementById('userAvatar').textContent = (userData.fullName||'A').charAt(0); 
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); 
    loadStaffList(); 
    loadAnnouncements(); 
  });
  
  document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href = 'auth.html'; });
  window.addEventListener('beforeunload', () => unsubscribes.forEach(u => u()));
</script>
</body>
</html>
