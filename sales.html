<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4da6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sales · OmoCreations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:#ff4da6; --primary-dark:#e6398c; --primary-light:#ffb3d9;
      --primary-soft:#fff0f6; --dark:#1a1a2e; --gray:#6b7280;
      --gray-light:#f3f4f6; --success:#10b981; --warning:#f59e0b;
      --danger:#ef4444; --info:#3b82f6;
      --sidebar-width:280px; --header-height:70px;
    }
    html { font-size:16px; -webkit-text-size-adjust:100%; }
    body {
      font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#f9fafb 0%,#fff0f6 100%);
      display:flex; min-height:100vh; overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    @keyframes flameRing { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,166,0.4)}50%{box-shadow:0 0 0 10px rgba(255,77,166,0)} }
    @keyframes fadeInUp { from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1} }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1} }

    .sidebar { width:var(--sidebar-width); min-width:var(--sidebar-width); background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1a 100%); color:white; position:fixed; top:0; left:0; height:100vh; overflow-y:auto; overflow-x:hidden; transition:transform 0.3s ease; z-index:1000; border-right:1px solid rgba(255,77,166,0.2); }
    .sidebar::-webkit-scrollbar { width:4px; } .sidebar::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); } .sidebar::-webkit-scrollbar-thumb { background:var(--primary); border-radius:10px; }
    .sidebar-header { padding:24px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,77,166,0.2); position:sticky; top:0; z-index:10; background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1a 100%); }
    .sidebar-header .close-sidebar { display:none; background:rgba(255,255,255,0.1); border:none; color:white; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1.2rem; margin-left:auto; align-items:center; justify-content:center; }
    .logo-icon { width:42px; height:42px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:700; flex-shrink:0; animation:flameRing 2s ease-in-out infinite; }
    .logo-text { font-size:1.25rem; font-weight:800; font-family:'Playfair Display',serif; white-space:nowrap; } .logo-text span { color:var(--primary); }
    .sidebar-nav { padding:20px 12px; display:flex; flex-direction:column; } .nav-section { margin-bottom:20px; }
    .nav-section-title { font-size:0.65rem; text-transform:uppercase; letter-spacing:2px; color:rgba(255,255,255,0.4); padding:8px 14px 6px; font-weight:600; white-space:nowrap; }
    .nav-item { display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; color:rgba(255,255,255,0.7); cursor:pointer; border:none; background:none; width:100%; font-size:0.9rem; font-weight:500; text-align:left; margin-bottom:3px; transition:all 0.2s; font-family:'Poppins',sans-serif; white-space:nowrap; text-decoration:none; }
    .nav-item i { width:22px; font-size:1.1rem; text-align:center; flex-shrink:0; } .nav-item:hover { background:rgba(255,77,166,0.15); color:white; transform:translateX(5px); }
    .nav-item.active { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; box-shadow:0 5px 15px rgba(255,77,166,0.3); } .nav-item.logout { color:rgba(239,68,68,0.7); margin-top:auto; } .nav-item.logout:hover { background:rgba(239,68,68,0.15); color:#ef4444; }
    .sidebar-footer { padding:20px; border-top:1px solid rgba(255,77,166,0.2); position:sticky; bottom:0; background:linear-gradient(0deg,#0f0f1a 0%,transparent 100%); }
    .user-profile { display:flex; align-items:center; gap:12px; } .user-avatar { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); display:flex; align-items:center; justify-content:center; font-weight:700; color:white; flex-shrink:0; font-size:1.1rem; }
    .user-details { white-space:nowrap; } .user-details h4 { font-size:0.85rem; font-weight:600; } .user-details p { font-size:0.7rem; opacity:0.6; }
    .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:999; display:none; } .sidebar-overlay.active { display:block; }

    .main-content { flex:1; margin-left:var(--sidebar-width); transition:margin-left 0.3s ease; min-height:100vh; width:calc(100% - var(--sidebar-width)); }
    .top-bar { height:var(--header-height); background:rgba(255,255,255,0.98); backdrop-filter:blur(12px); padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,77,166,0.15); position:sticky; top:0; z-index:50; }
    .top-bar-left { display:flex; align-items:center; gap:14px; } .menu-toggle { background:none; border:none; font-size:1.3rem; color:var(--gray); cursor:pointer; padding:10px; border-radius:10px; transition:all 0.2s; display:none; align-items:center; justify-content:center; } .menu-toggle:hover { background:var(--primary-soft); color:var(--primary); }
    .page-title { font-size:1.5rem; font-weight:700; color:var(--dark); font-family:'Playfair Display',serif; } .current-date { color:var(--gray); font-size:0.85rem; white-space:nowrap; }
    .content-wrapper { padding:28px; max-width:1600px; }

    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
    .stat-card { background:white; padding:18px 16px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.03); border:1px solid rgba(255,77,166,0.1); transition:all 0.3s; position:relative; overflow:hidden; animation:fadeInUp 0.5s ease forwards; opacity:0; }
    .stat-card:nth-child(1){animation-delay:0.05s}.stat-card:nth-child(2){animation-delay:0.10s}.stat-card:nth-child(3){animation-delay:0.15s}.stat-card:nth-child(4){animation-delay:0.20s}
    .stat-card:hover { transform:translateY(-5px); box-shadow:0 12px 24px rgba(255,77,166,0.15); }
    .stat-header { display:flex; justify-content:space-between; margin-bottom:12px; }
    .stat-header span { font-size:0.65rem; color:var(--gray); text-transform:uppercase; font-weight:600; letter-spacing:1px; }
    .stat-icon { width:36px; height:36px; border-radius:12px; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; color:var(--primary); }
    .stat-value { font-size:1.8rem; font-weight:800; color:var(--dark); font-family:'Playfair Display',serif; line-height:1; }
    .stat-sub { font-size:0.65rem; color:var(--gray); margin-top:4px; }

    .stat-card.value-locked .stat-value { filter:blur(8px); user-select:none; cursor:pointer; position:relative; }
    .stat-card.value-locked .stat-value::after { content:'\f023'; font-family:'Font Awesome 6 Free'; font-weight:900; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--gray); filter:none; }
    .stat-card .value-hint { font-size:0.6rem; color:var(--primary); text-align:center; cursor:pointer; margin-top:2px; display:none; }
    .stat-card.value-locked .value-hint { display:block; }

    .filter-bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .search-wrapper { flex:1; min-width:200px; position:relative; }
    .search-wrapper i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--gray); }
    .search-input { width:100%; padding:12px 16px 12px 42px; border:1.5px solid rgba(0,0,0,0.08); border-radius:40px; font-size:0.85rem; outline:none; font-family:'Poppins',sans-serif; }
    .search-input:focus { border-color:var(--primary); }

    .panel { background:white; border-radius:24px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.02); border:1px solid rgba(255,77,166,0.08); margin-bottom:24px; }
    .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .panel-header h3 { font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:10px; color:var(--dark); }
    .panel-header h3 i { color:var(--primary); }

    .table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:16px; }
    .data-table { width:100%; border-collapse:collapse; min-width:1100px; }
    .data-table th { text-align:left; padding:14px 10px; font-size:0.7rem; font-weight:600; color:var(--gray); text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid var(--primary-soft); white-space:nowrap; background:white; }
    .data-table td { padding:14px 10px; border-bottom:1px solid rgba(0,0,0,0.04); font-size:0.85rem; }
    .data-table tbody tr { transition:background 0.2s; cursor:pointer; }
    .data-table tbody tr:hover { background:var(--primary-soft); }
    .data-table tbody tr.returned-row { background:rgba(239,68,68,0.03); }

    .badge { padding:5px 12px; border-radius:40px; font-size:0.7rem; font-weight:600; display:inline-block; white-space:nowrap; }
    .badge-success { background:rgba(16,185,129,0.1); color:var(--success); }
    .badge-warning { background:rgba(245,158,11,0.1); color:var(--warning); }
    .badge-danger { background:rgba(239,68,68,0.1); color:var(--danger); }
    .badge-info { background:rgba(59,130,246,0.1); color:var(--info); }

    .btn { padding:8px 16px; border-radius:40px; font-weight:600; font-size:0.75rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; background:white; border:1px solid rgba(0,0,0,0.08); transition:all 0.2s; font-family:'Poppins',sans-serif; white-space:nowrap; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; }
    .btn-outline { border:1.5px solid rgba(255,77,166,0.3); color:var(--primary); background:transparent; }
    .btn-sm { padding:6px 12px; font-size:0.7rem; }
    .btn-success { background:var(--success); color:white; border:none; }
    .btn-danger { background:var(--danger); color:white; border:none; }
    .btn-warning { background:var(--warning); color:white; border:none; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:2000; padding:16px; }
    .modal-overlay.active { display:flex; }
    .modal { background:white; border-radius:28px; padding:28px; max-width:750px; width:100%; max-height:85vh; overflow-y:auto; animation:fadeInUp 0.3s ease; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .modal-header h3 { font-size:1.2rem; font-weight:700; }
    .modal-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray); padding:5px; transition:all 0.2s; } .modal-close:hover { color:var(--danger); transform:rotate(90deg); }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:0.8rem; font-weight:600; color:var(--dark); margin-bottom:6px; }
    .form-control { width:100%; padding:12px 16px; border:1.5px solid rgba(0,0,0,0.08); border-radius:14px; font-size:0.9rem; outline:none; background:white; font-family:'Poppins',sans-serif; transition:border 0.2s; }
    .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(255,77,166,0.1); }

    .customer-type-toggle { display:flex; gap:10px; margin-bottom:15px; }
    .customer-type-btn { flex:1; padding:12px; border:1.5px solid rgba(0,0,0,0.08); border-radius:14px; background:white; cursor:pointer; font-weight:600; font-size:0.85rem; font-family:'Poppins',sans-serif; transition:all 0.2s; }
    .customer-type-btn.active { border-color:var(--primary); background:var(--primary-soft); color:var(--primary); }

    .payment-methods { display:flex; gap:10px; margin-top:5px; }
    .payment-method { flex:1; text-align:center; padding:12px; border:1.5px solid rgba(0,0,0,0.08); border-radius:12px; cursor:pointer; font-family:'Poppins',sans-serif; transition:all 0.2s; }
    .payment-method.selected { border-color:var(--primary); background:var(--primary-soft); }

    .item-row { display:flex; gap:10px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
    .item-row .item-select { flex:3; min-width:180px; }
    .item-row .item-size { flex:1; min-width:100px; }
    .item-row .item-qty { flex:0.5; min-width:60px; }

    /* Non‑inventory toggle style */
    .non-inv-toggle { display:flex; align-items:center; gap:4px; font-size:0.7rem; white-space:nowrap; margin-right:6px; }
    .non-inv-toggle input { margin:0; }

    .sale-summary { background:var(--gray-light); border-radius:14px; padding:16px; margin-top:20px; }
    .summary-row { display:flex; justify-content:space-between; padding:5px 0; }
    .summary-row.total { font-weight:700; font-size:1.1rem; border-top:1px dashed rgba(0,0,0,0.1); margin-top:8px; padding-top:12px; }

    .pin-input-container { display:flex; gap:10px; justify-content:center; margin:20px 0; }
    .pin-input { width:55px; height:65px; text-align:center; font-size:1.8rem; font-weight:700; border:2px solid rgba(255,77,166,0.2); border-radius:14px; outline:none; font-family:'Poppins',sans-serif; }
    .pin-input:focus { border-color:var(--primary); }

    /* UPDATED RECEIPT STYLING – clear font, bold only for header */
    .receipt-container {
      background:#f8f9fa; border-radius:12px; padding:20px;
      font-family:'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-weight:normal;
    }
    .receipt-header { text-align:center; border-bottom:1px dashed #ccc; padding-bottom:10px; margin-bottom:10px; }
    .receipt-header h2 { font-weight:bold; margin:0; }
    .receipt-header .addr { font-weight:bold; margin:2px 0; }
    .receipt-header .rec { margin:2px 0; font-weight:normal; }
    .receipt-items { margin:15px 0; }
    .receipt-item { display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:5px; font-weight:normal; }
    .receipt-total { border-top:1px dashed #ccc; padding-top:10px; font-weight:bold; font-size:1.1rem; display:flex; justify-content:space-between; }
    .cust-info { font-weight:normal; margin:4px 0; line-height:1.3; }
    .thanks { text-align:center; font-style:italic; margin-top:15px; font-weight:normal; }

    .return-options { display:grid; grid-template-columns:1fr; gap:10px; margin:15px 0; }
    .return-option { padding:14px; border:1.5px solid rgba(0,0,0,0.08); border-radius:14px; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:12px; }
    .return-option:hover { border-color:var(--primary); background:var(--primary-soft); }
    .return-option.selected { border-color:var(--primary); background:var(--primary-soft); }
    .return-option i { font-size:1.3rem; color:var(--primary); width:30px; text-align:center; }

    .empty-state { text-align:center; padding:40px 20px; color:var(--gray); }
    .empty-state i { font-size:2.5rem; color:var(--primary-light); margin-bottom:10px; display:block; }

    .toast-container { position:fixed; bottom:24px; right:24px; z-index:3000; display:flex; flex-direction:column; gap:10px; }
    .toast { background:white; color:var(--dark); padding:14px 20px; border-radius:50px; box-shadow:0 10px 30px rgba(0,0,0,0.15); display:flex; align-items:center; gap:10px; font-weight:500; font-size:0.85rem; animation:slideIn 0.3s ease; border-left:4px solid var(--primary); transition:all 0.3s ease; }
    .toast.success { border-left-color:var(--success); } .toast.error { border-left-color:var(--danger); } .toast i { font-size:1.1rem; }

    @media (max-width:1400px) { .stats-grid { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); width:280px !important; min-width:280px !important; } .sidebar.mobile-open { transform:translateX(0); box-shadow:10px 0 40px rgba(0,0,0,0.3); }
      .sidebar-header .close-sidebar { display:flex !important; } .menu-toggle { display:flex !important; }
      .main-content { margin-left:0 !important; width:100% !important; } .content-wrapper { padding:16px 12px; } .top-bar { padding:0 16px; }
      .page-title { font-size:1.1rem; } .current-date { display:none; } .stats-grid { grid-template-columns:1fr 1fr; gap:10px; }
      .stat-card { padding:14px 12px; } .stat-value { font-size:1.4rem; } .panel { padding:16px 12px; border-radius:18px; }
      .data-table { min-width:900px; } .data-table th, .data-table td { padding:10px 6px; font-size:0.75rem; } .modal { padding:20px; border-radius:20px; }
    }
    @media (max-width:480px) { .stats-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo-icon">✨</div><div class="logo-text"><span>Omo</span>creations</div><button class="close-sidebar" onclick="closeSidebar()"><i class="fas fa-times"></i></button></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer"><div class="user-profile"><div class="user-avatar" id="userAvatar">A</div><div class="user-details"><h4 id="userName">Staff</h4><p id="userRole">Loading...</p></div></div></div>
</aside>

<main class="main-content">
  <header class="top-bar">
    <div class="top-bar-left"><button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><h1 class="page-title">Sales & Transactions</h1></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="btn btn-outline btn-sm" onclick="navigateTo('history.html')"><i class="fas fa-history"></i> History</button>
      <span class="current-date" id="currentDate"></span>
    </div>
  </header>

  <div class="content-wrapper">

    <div class="stats-grid">
      <div class="stat-card value-locked" id="todayCard"><div class="stat-header"><span>Today's Sales</span><div class="stat-icon"><i class="fas fa-calendar-day"></i></div></div><div class="stat-value" id="todaySales">₦0</div><div class="stat-sub" id="todayTransactions">0 txn</div><div class="value-hint" onclick="revealStats()"><i class="fas fa-lock"></i> Tap to unlock</div></div>
      <div class="stat-card value-locked" id="weekCard"><div class="stat-header"><span>This Week</span><div class="stat-icon"><i class="fas fa-calendar-week"></i></div></div><div class="stat-value" id="weekSales">₦0</div><div class="stat-sub" id="weekTransactions">0 txn</div><div class="value-hint" onclick="revealStats()"><i class="fas fa-lock"></i> Tap to unlock</div></div>
      <div class="stat-card value-locked" id="monthCard"><div class="stat-header"><span>This Month</span><div class="stat-icon"><i class="fas fa-calendar-alt"></i></div></div><div class="stat-value" id="monthSales">₦0</div><div class="stat-sub" id="monthTransactions">0 txn</div><div class="value-hint" onclick="revealStats()"><i class="fas fa-lock"></i> Tap to unlock</div></div>
      <div class="stat-card value-locked" id="yearCard"><div class="stat-header"><span>This Year</span><div class="stat-icon"><i class="fas fa-chart-line"></i></div></div><div class="stat-value" id="yearSales">₦0</div><div class="stat-sub" id="yearTransactions">0 txn</div><div class="value-hint" onclick="revealStats()"><i class="fas fa-lock"></i> Tap to unlock</div></div>
    </div>

    <div class="filter-bar">
      <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" class="search-input" id="salesSearchInput" placeholder="Search by customer, phone, or receipt #..."></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h3><i class="fas fa-history"></i> Recent Sales</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="exportSalesData()"><i class="fas fa-download"></i> Export</button>
          <button class="btn btn-outline btn-sm" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh</button>
          <button class="btn btn-primary btn-sm" onclick="openNewSaleModal()"><i class="fas fa-plus"></i> New Sale</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>Time</th><th>Receipt #</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="salesTable"><tr><td colspan="9"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading sales...</p></div></td></tr></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal"><div class="modal-header"><h3 id="modalTitle">Modal</h3><button class="modal-close" onclick="hideModal()">&times;</button></div><div id="modalContent"></div></div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script type="module">

  const firebaseConfig = {
    apiKey: "AIzaSyA_JPUfHVotadGfntwk8qQXFp64pvDfTRI",
    authDomain: "fashion-46e5d.firebaseapp.com",

  const app = initializeApp(firebaseConfig);

  function formatTime(d) { if(!d) return '-'; const date=d.toDate?d.toDate():new Date(d); return date.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  function formatCurrency(n) { return '₦'+(n||0).toLocaleString(); }
  function navigateTo(url) { window.location.href=url; }
  window.navigateTo = navigateTo;
  function generateReceiptNumber() { return 'RCP-'+Date.now().toString().slice(-8)+'-'+Math.random().toString(36).substr(2,4).toUpperCase(); }

  function showToast(msg, type='success') {
    const c=document.getElementById('toastContainer'); if(!c) return;
    const t=document.createElement('div'); t.className=`toast ${type}`;
    t.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all 0.3s ease';setTimeout(()=>t.remove(),300);},3500);
  }

  async function logAudit(action, note) {
    try { await addDoc(collection(db,'audit_logs'),{actionType:action,performedBy:currentUser?.uid||'unknown',performedByName:userData?.fullName||'Staff',performedAt:serverTimestamp(),note:note||''}); } catch(e){}
  }

  function hideModal() { document.getElementById('modalOverlay').classList.remove('active'); }
  window.hideModal = hideModal;
  function showModal(title, content) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalContent').innerHTML = content;

  function cleanup() { unsubscribes.forEach(u=>u()); unsubscribes=[]; }

  window.toggleSidebar = function() {
    const s=document.getElementById('sidebar'), o=document.getElementById('sidebarOverlay');

    document.getElementById('sidebar').classList.remove('mobile-open');

  document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideModal();closeSidebar();}});

  function buildSidebar() {
    const nav=document.getElementById('sidebarNav'); if(!nav) return;

      <div class="nav-section"><div class="nav-section-title">OVERVIEW</div>

      <div class="nav-section"><div class="nav-section-title">MONITORING</div>
        <button class="nav-item" onclick="navigateTo('inventory.html')"><i class="fas fa-box"></i><span>Inventory</span></button>

        <button class="nav-item" onclick="navigateTo('customers.html')"><i class="fas fa-users"></i><span>Customers</span></button>

        ${isAdmin()?`<button class="nav-item" onclick="navigateTo('orders-admin.html')"><i class="fas fa-clipboard-list"></i><span>Orders Admin</span></button>`:''}

  function showPinModal(title,action,onSuccess){
    showModal(title,`<p style="text-align:center;margin-bottom:20px;">Enter your 4-digit PIN to ${action}</p><div class="pin-input-container"><input type="password" maxlength="1" class="pin-input" id="pin1"><input type="password" maxlength="1" class="pin-input" id="pin2"><input type="password" maxlength="1" class="pin-input" id="pin3"><input type="password" maxlength="1" class="pin-input" id="pin4"></div><button class="btn btn-primary" id="verifyPinBtn" style="width:100%;">Verify</button>`);
    document.getElementById('pin1').focus();
    document.querySelectorAll('#modalOverlay .pin-input').forEach((inp,i,arr)=>{inp.addEventListener('input',e=>{if(e.target.value&&i<arr.length-1)arr[i+1].focus();});});
    document.getElementById('verifyPinBtn').onclick=()=>{const pin=['pin1','pin2','pin3','pin4'].map(id=>document.getElementById(id).value).join('');if(pin===(userData?.attendantPin||'1234')){hideModal();onSuccess();}else{showToast('Invalid PIN','error');}};
  }

  window.revealStats = function() {
    if(statsRevealed) return;
    if(isAdmin()){statsRevealed=true;updateStatsDisplay();return;}
    showPinModal('Unlock Financial Stats','view sales figures',()=>{statsRevealed=true;updateStatsDisplay();logAudit('reveal_sales_stats','Sales figures revealed');showToast('Sales figures unlocked','success');});
  };

  function updateStatsDisplay() {
    if(!statsRevealed) return;
    ['todayCard','weekCard','monthCard','yearCard'].forEach(id=>{
      const card=document.getElementById(id);
      if(card){
        card.classList.remove('value-locked');
        const valEl=card.querySelector('.stat-value');
        if(valEl){valEl.style.filter='none';valEl.style.cursor='default';}
        const hint=card.querySelector('.value-hint');
        if(hint)hint.style.display='none';
      }
    });
  }

  function updateStats(){
    const now=new Date();
    const today=now.toISOString().split('T')[0];
    const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay());
    const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
    const yearStart=new Date(now.getFullYear(),0,1);
    let todayTotal=0,weekTotal=0,monthTotal=0,yearTotal=0,todayCount=0,weekCount=0,monthCount=0,yearCount=0;
    allSales.forEach(s=>{if(s.status==='returned')return;const d=s.createdAt?.toDate();if(!d)return;const amt=parseFloat(s.totalAmount)||0;if(d.toISOString().split('T')[0]===today){todayTotal+=amt;todayCount++;}if(d>=weekStart){weekTotal+=amt;weekCount++;}if(d>=monthStart){monthTotal+=amt;monthCount++;}if(d>=yearStart){yearTotal+=amt;yearCount++;}});
    allReturns.forEach(r=>{if(r.returnAction!=='refund')return;const d=r.createdAt?.toDate();if(!d)return;const amt=parseFloat(r.totalRefund)||0;if(d.toISOString().split('T')[0]===today){todayTotal-=amt;todayCount--;}if(d>=weekStart){weekTotal-=amt;weekCount--;}if(d>=monthStart){monthTotal-=amt;monthCount--;}if(d>=yearStart){yearTotal-=amt;yearCount--;}});
    document.getElementById('todaySales').textContent=formatCurrency(Math.max(0,todayTotal));
    document.getElementById('weekSales').textContent=formatCurrency(Math.max(0,weekTotal));
    document.getElementById('monthSales').textContent=formatCurrency(Math.max(0,monthTotal));
    document.getElementById('yearSales').textContent=formatCurrency(Math.max(0,yearTotal));
    document.getElementById('todayTransactions').textContent=`${Math.max(0,todayCount)} txn`;
    document.getElementById('weekTransactions').textContent=`${Math.max(0,weekCount)} txn`;
    document.getElementById('monthTransactions').textContent=`${Math.max(0,monthCount)} txn`;
    document.getElementById('yearTransactions').textContent=`${Math.max(0,yearCount)} txn`;
  }

  function renderSales(){
    const tbody=document.getElementById('salesTable');
    const search=(document.getElementById('salesSearchInput')?.value||'').toLowerCase();
    let filtered=[...allSales];
    if(search) filtered=filtered.filter(s=>(s.customerName||'').toLowerCase().includes(search)||(s.customerPhone||'').toLowerCase().includes(search)||(s.receiptNumber||'').toLowerCase().includes(search));
    tbody.innerHTML='';
    if(filtered.length===0){tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><i class="fas fa-cash-register"></i><p>No sales found</p></div></td></tr>';updateStats();return;}
    filtered.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    filtered.forEach(s=>{
      const isReturned=s.status==='returned';
      const statusBadge=isReturned?`<span class="badge badge-danger">Returned</span>`:`<span class="badge badge-success">Completed</span>`;
      const returnInfo=isReturned?`<br><small style="color:var(--danger);">Action: ${s.returnAction?.replace(/_/g,' ')} | Refund: -${formatCurrency(s.totalRefund||0)}</small>`:'';
      tbody.innerHTML+=`<tr class="${isReturned?'returned-row':''}"><td>${formatTime(s.createdAt)}</td><td><span class="badge badge-info">${s.receiptNumber||'N/A'}</span></td><td style="cursor:pointer;color:var(--primary);font-weight:600;" onclick="navigateTo('history.html?customerId=${s.customerId||''}')">${s.customerName||'Walk-in'}</td><td>${s.customerPhone||'-'}</td><td>${s.items?.length||0} items</td><td><strong style="color:${isReturned?'var(--danger)':'inherit'};">${isReturned?'-':''}${formatCurrency(s.totalAmount)}</strong>${returnInfo}</td><td><span class="badge badge-success">${s.paymentMethod||'cash'}</span></td><td>${statusBadge}</td><td><div style="display:flex;gap:4px;"><button class="btn btn-sm btn-outline" onclick="viewReceipt('${s.id}')" title="View"><i class="fas fa-receipt"></i></button><button class="btn btn-sm btn-outline" onclick="printReceipt('${s.id}')" title="Print"><i class="fas fa-print"></i></button>${!isReturned?`<button class="btn btn-sm btn-warning" onclick="openReturnModal('${s.id}')" title="Return"><i class="fas fa-undo"></i></button>`:''}</div></td></tr>`;
    });
    updateStats();
  }

  function loadSales(){
    cleanup();
    const q=query(collection(db,'sales'),orderBy('createdAt','desc'));
    unsubscribes.push(onSnapshot(q,snap=>{allSales=snap.docs.map(d=>({id:d.id,...d.data()}));renderSales();},error=>{unsubscribes.push(onSnapshot(collection(db,'sales'),snap=>{allSales=snap.docs.map(d=>({id:d.id,...d.data()}));allSales.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderSales();}));}));
    unsubscribes.push(onSnapshot(query(collection(db,'returns'),orderBy('createdAt','desc')),snap=>{allReturns=snap.docs.map(d=>({id:d.id,...d.data()}));renderSales();},error=>{unsubscribes.push(onSnapshot(collection(db,'returns'),snap=>{allReturns=snap.docs.map(d=>({id:d.id,...d.data()}));allReturns.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderSales();}));}));
  }

  async function loadCustomersAndStock(){
    try{
      const custSnap=await getDocs(query(collection(db,'customers'),where('status','==','approved')));
      allCustomers=custSnap.docs.map(d=>({id:d.id,...d.data()}));

      const stockSnap=await getDocs(collection(db,'stock_items'));
      allStockItems=stockSnap.docs.map(d=>{
        const data=d.data();
        return {
          id:d.id,...data,
          unitQty: parseFloat(data.unitQty ?? data.quantityAvailable ?? data.initialStock ?? 0),
          unitPrice: parseFloat(data.unitPrice ?? 0),
          halfPrice: parseFloat(data.halfPrice ?? 0),
          quarterPrice: parseFloat(data.quarterPrice ?? 0),
          packSize: parseInt(data.packSize ?? 12),
          packPrice: parseFloat(data.packPrice ?? 0),
          bundleSize: parseInt(data.bundleSize ?? 50),
          bundlePrice: parseFloat(data.bundlePrice ?? 0),
          measureUnit: data.measureUnit ?? 'piece',
          itemType: data.itemType ?? 'general'
        };
      }).filter(i=>i.status !== 'deleted');
    }catch(e){showToast('Error loading data','error');}
  }

  function getItemTypeLabel(type){ const labels={simple:'🔧',fashion:'👗',pack_bundle:'📦',measured:'📏',pack:'📦',general:'🔧'}; return labels[type]||'🔧'; }

  function getStockOptionsHtml() {
    return allStockItems.map(i=>{
      const it=i.itemType||'general'; const label=getItemTypeLabel(it);
      const pp=i.packPrice?` | Pk:${formatCurrency(i.packPrice)}`:'';
      const bp=i.bundlePrice?` | Bndl:${formatCurrency(i.bundlePrice)}`:'';
      const hp=i.halfPrice?` | ½:${formatCurrency(i.halfPrice)}`:'';
      const qp=i.quarterPrice?` | ¼:${formatCurrency(i.quarterPrice)}`:'';
      const stock=parseFloat(i.unitQty||0);
      return `<option value="${i.id}" data-name="${i.name||''}" data-price="${i.unitPrice||0}" data-halfprice="${i.halfPrice||0}" data-quarterprice="${i.quarterPrice||0}" data-packprice="${i.packPrice||0}" data-bundleprice="${i.bundlePrice||0}" data-packsize="${i.packSize||12}" data-bundlesize="${i.bundleSize||50}" data-stock="${stock}">${label} ${i.name||''} - ${formatCurrency(i.unitPrice||0)}${hp}${qp}${pp}${bp} (Qty: ${stock})</option>`;
    }).join('');
  }

  function getSizeOptions(item){
    const opts = [];
    if(parseFloat(item.unitPrice) > 0) opts.push({value:'1',label:'1 (Unit/Yard)'});
    if(parseFloat(item.halfPrice) > 0) opts.push({value:'0.5',label:'½ (Half)'});
    if(parseFloat(item.quarterPrice) > 0) opts.push({value:'0.25',label:'¼ (Quarter)'});
    if(parseFloat(item.packPrice) > 0) opts.push({value:'pack',label:`📦 Pack (${item.packSize||12})`});
    if(parseFloat(item.bundlePrice) > 0) opts.push({value:'bundle',label:`📦 Bundle (${item.bundleSize||50})`});
    if(opts.length === 0) opts.push({value:'1',label:'1 (Unit)'});
    return opts;
  }

  // ==================== NEW SALE MODAL (with non‑inventory toggle) ====================
  window.openNewSaleModal = async function(){
    await loadCustomersAndStock();
    // Remove the old "No items available" check because we can now sell non‑inventory items
    // if(allStockItems.length===0){showToast('No items available','error');return;}

    const custOptions=allCustomers.map(c=>`<option value="${c.id}" data-name="${c.fullName||''}" data-phone="${c.phone||''}" data-address="${c.address||c.location||''}">${c.fullName||''} - ${c.phone||'No phone'}</option>`).join('');
    const stockOptions = getStockOptionsHtml();

    showModal('New Sale',`
      <div class="customer-type-toggle"><button class="customer-type-btn active" data-type="existing" onclick="window._switchCustomerType('existing')"><i class="fas fa-users"></i> Existing</button><button class="customer-type-btn" data-type="new" onclick="window._switchCustomerType('new')"><i class="fas fa-user-plus"></i> New</button></div>
      <div id="existingCustomerSection"><div class="form-group"><label>Search Customer</label><select class="form-control" id="existingCustomerSelect" style="width:100%;"><option value="">-- Search --</option>${custOptions}</select></div></div>
      <div id="newCustomerSection" style="display:none;"><div class="form-group"><label>Full Name *</label><input type="text" class="form-control" id="newCustomerName"></div><div class="form-group"><label>Phone *</label><input type="tel" class="form-control" id="newCustomerPhone"></div><div class="form-group"><label>Address *</label><textarea class="form-control" id="newCustomerAddress" rows="2"></textarea></div><div class="form-group"><label>Email</label><input type="email" class="form-control" id="newCustomerEmail"></div></div>
      <div id="saleItems">
        <div class="item-row">
          <div class="non-inv-toggle"><input type="checkbox" class="non-inv-check" onchange="window._toggleNonInventory(this)"> <span>Non‑Inventory</span></div>
          <select class="form-control item-select" style="width:100%;"><option value="">-- Search product --</option>${stockOptions}</select>
          <input type="text" class="form-control item-custom-name" placeholder="Item name" style="display:none; flex:2;">
          <select class="form-control item-size"><option value="1">1 (Unit)</option></select>
          <input type="number" class="form-control item-qty" value="1" min="1" style="width:80px;">
          <input type="number" class="form-control item-custom-price" placeholder="Price ₦" step="0.01" style="display:none; width:100px;">
        </div>
      </div>
      <button type="button" class="btn btn-outline btn-sm" onclick="window._addSaleItem()"><i class="fas fa-plus"></i> Add Item</button>
      <div class="form-group" style="margin-top:20px;"><label>Payment</label><div class="payment-methods"><div class="payment-method selected" data-method="cash" onclick="window._selectPayment('cash')">💵 Cash</div><div class="payment-method" data-method="transfer" onclick="window._selectPayment('transfer')">🏦 Transfer</div><div class="payment-method" data-method="pos" onclick="window._selectPayment('pos')">💳 POS</div></div></div>
      <div class="sale-summary"><div class="summary-row"><span>Items:</span><span id="itemCount">0</span></div><div class="summary-row total"><span>Total:</span><span id="saleTotal">₦0</span></div></div>
      <button class="btn btn-primary" onclick="window._processSale()" style="width:100%;margin-top:15px;"><i class="fas fa-check-circle"></i> Process Sale</button>
    `);

    setTimeout(()=>{
      $('#existingCustomerSelect').select2({placeholder:'Search customer...',allowClear:true,width:'100%',dropdownParent:$('#modalOverlay')});
      // Initialize Select2 only for visible selects (the first row has inventory select visible)
      const firstRow = document.querySelector('.item-row');
      const invSelect = firstRow?.querySelector('.item-select');
      if (invSelect && invSelect.style.display !== 'none') {
        $(invSelect).select2({placeholder:'Search product...',allowClear:true,width:'100%',dropdownParent:$('#modalOverlay')}).on('change',function(){window._updateSizeDropdown(this);window._updateSaleSummary();});
      }
      $('.item-qty').on('input',window._updateSaleSummary);
      $('.item-size').on('change',window._updateSaleSummary);
      window._updateSaleSummary();
    },150);
  };

  // Toggle non‑inventory mode for a row
  window._toggleNonInventory = function(checkbox) {
    const row = checkbox.closest('.item-row');
    const select = row.querySelector('.item-select');
    const customName = row.querySelector('.item-custom-name');
    const customPrice = row.querySelector('.item-custom-price');
    const sizeSelect = row.querySelector('.item-size');
    const qtyInput = row.querySelector('.item-qty');

    if (checkbox.checked) {
      // Hide inventory select and size, show custom name and price
      select.style.display = 'none';
      sizeSelect.style.display = 'none';
      customName.style.display = '';
      customPrice.style.display = '';
      // Destroy Select2 if present
      if ($(select).data('select2')) $(select).select2('destroy');
      select.value = '';
    } else {
      // Show inventory select and size, hide custom fields
      select.style.display = '';
      sizeSelect.style.display = '';
      customName.style.display = 'none';
      customPrice.style.display = 'none';
      // Re‑initialize Select2
      $(select).select2({placeholder:'Search product...',allowClear:true,width:'100%',dropdownParent:$('#modalOverlay')}).on('change',function(){window._updateSizeDropdown(this);window._updateSaleSummary();});
    }
    window._updateSaleSummary();
  };

  // Override _updateSaleSummary to handle custom items
  window._updateSaleSummary = function() {
    let total = 0, count = 0;
    document.querySelectorAll('.item-row').forEach(row => {
      const checkbox = row.querySelector('.non-inv-check');
      const qtyEl = row.querySelector('.item-qty');
      const qty = parseFloat(qtyEl?.value) || 1;
      if (checkbox && checkbox.checked) {
        // Non‑inventory item
        const priceEl = row.querySelector('.item-custom-price');
        const price = parseFloat(priceEl?.value) || 0;
        total += price * qty;
        count++;
      } else {
        // Inventory item
        const select = row.querySelector('.item-select');
        const sizeEl = row.querySelector('.item-size');
        if (select && select.value) {
          const opt = select.options[select.selectedIndex];
          const size = sizeEl?.value || '1';
          let price = parseFloat(opt?.getAttribute('data-price')) || 0;
          if (size === '0.5' && parseFloat(opt?.getAttribute('data-halfprice')) > 0) price = parseFloat(opt.getAttribute('data-halfprice'));
          else if (size === '0.25' && parseFloat(opt?.getAttribute('data-quarterprice')) > 0) price = parseFloat(opt.getAttribute('data-quarterprice'));
          else if (size === 'pack' && parseFloat(opt?.getAttribute('data-packprice')) > 0) price = parseFloat(opt.getAttribute('data-packprice'));
          else if (size === 'bundle' && parseFloat(opt?.getAttribute('data-bundleprice')) > 0) price = parseFloat(opt.getAttribute('data-bundleprice'));
          total += price * qty;
          count++;
        }
      }
    });
    document.getElementById('itemCount').textContent = count;
    document.getElementById('saleTotal').textContent = formatCurrency(total);
  };

  // Modify _addSaleItem to include the toggle
  window._addSaleItem = function() {
    const stockOptions = getStockOptionsHtml();
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
      <div class="non-inv-toggle"><input type="checkbox" class="non-inv-check" onchange="window._toggleNonInventory(this)"> <span>Non‑Inventory</span></div>
      <select class="form-control item-select" style="width:100%;"><option value="">-- Search --</option>${stockOptions}</select>
      <input type="text" class="form-control item-custom-name" placeholder="Item name" style="display:none; flex:2;">
      <select class="form-control item-size"><option value="1">1 (Unit)</option></select>
      <input type="number" class="form-control item-qty" value="1" min="1" style="width:80px;">
      <input type="number" class="form-control item-custom-price" placeholder="Price ₦" step="0.01" style="display:none; width:100px;">
      <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove();window._updateSaleSummary();"><i class="fas fa-times"></i></button>
    `;
    document.getElementById('saleItems').appendChild(div);

    const invSelect = div.querySelector('.item-select');
    // Initialize Select2 for the new row (only if visible)
    if (invSelect.style.display !== 'none') {
      $(invSelect).select2({placeholder:'Search product...',allowClear:true,width:'100%',dropdownParent:$('#modalOverlay')}).on('change',function(){window._updateSizeDropdown(this);window._updateSaleSummary();});
    }
    $(div).find('.item-qty').on('input', window._updateSaleSummary);
    $(div).find('.item-size').on('change', window._updateSaleSummary);
    window._updateSaleSummary();
  };

  // Modify _processSale to handle non‑inventory items
  window._processSale = function() {
    let customerId='',customerName='',customerPhone='',customerEmail='',customerAddress='';
    if(customerType==='existing'){const select=document.getElementById('existingCustomerSelect');if(!select||!select.value){showToast('Select a customer','error');return;}customerId=select.value;const opt=select.options[select.selectedIndex];customerName=opt.dataset.name;customerPhone=opt.dataset.phone;customerAddress=opt.dataset.address||'';}
    else{customerName=document.getElementById('newCustomerName')?.value?.trim();customerPhone=document.getElementById('newCustomerPhone')?.value?.trim();customerEmail=document.getElementById('newCustomerEmail')?.value?.trim();customerAddress=document.getElementById('newCustomerAddress')?.value?.trim();if(!customerName||!customerPhone||!customerAddress){showToast('Name, phone & address required','error');return;}}

    const items=[];let total=0;
    for(const row of document.querySelectorAll('.item-row')){
      const checkbox = row.querySelector('.non-inv-check');
      const qtyEl = row.querySelector('.item-qty');
      const qty = parseFloat(qtyEl?.value) || 1;
      if (checkbox && checkbox.checked) {
        // Non‑inventory item
        const nameEl = row.querySelector('.item-custom-name');
        const priceEl = row.querySelector('.item-custom-price');
        const name = nameEl?.value?.trim();
        const price = parseFloat(priceEl?.value) || 0;
        if (!name || price <= 0) { showToast('Enter valid name and price for custom item', 'error'); return; }
        items.push({
          name,
          quantity: qty,
          unitPrice: price,
          size: '1',
          sizeLabel: '1',
          isNonInventory: true
        });
        total += price * qty;
      } else {
        // Inventory item (unchanged)
        const select=row.querySelector('.item-select');const sizeEl=row.querySelector('.item-size');
        if(select&&select.value){
          const opt=select.options[select.selectedIndex];
          const stockAvailable=parseFloat(opt?.getAttribute('data-stock'))||0;
          const size=sizeEl?.value||'1';
          let price=parseFloat(opt?.getAttribute('data-price'))||0;
          let deductQty=qty; let sizeLabel='1';
          if(size==='0.5'){
              deductQty=qty*0.5; sizeLabel='½';
              if(parseFloat(opt?.getAttribute('data-halfprice'))>0) price=parseFloat(opt.getAttribute('data-halfprice'));
          } else if(size==='0.25'){
              deductQty=qty*0.25; sizeLabel='¼';
              if(parseFloat(opt?.getAttribute('data-quarterprice'))>0) price=parseFloat(opt.getAttribute('data-quarterprice'));
          } else if(size==='pack'){
              deductQty=qty*(parseInt(opt?.getAttribute('data-packsize'))||12); sizeLabel='📦 Pack';
              if(parseFloat(opt?.getAttribute('data-packprice'))>0) price=parseFloat(opt.getAttribute('data-packprice'));
          } else if(size==='bundle'){
              deductQty=qty*(parseInt(opt?.getAttribute('data-bundlesize'))||50); sizeLabel='📦 Bundle';
              if(parseFloat(opt?.getAttribute('data-bundleprice'))>0) price=parseFloat(opt.getAttribute('data-bundleprice'));
          }
          if(deductQty>stockAvailable){showToast(`Only ${stockAvailable} available for ${opt.dataset.name}`,'error');return;}
          items.push({id:select.value,name:opt.dataset.name,quantity:qty,size:size,sizeLabel,unitPrice:price,deductQty:deductQty});
          total+=price*qty;
        }
      }
    }
    if(items.length===0){showToast('Add at least one item','error');return;}
    const receiptNumber=generateReceiptNumber();

    showPinModal('Process Sale',`process sale of ${formatCurrency(total)}`,async()=>{
      try{
        const batch=writeBatch(db);
        if(customerType==='new'){const custRef=doc(collection(db,'customers'));batch.set(custRef,{fullName:customerName,phone:customerPhone,email:customerEmail,address:customerAddress,location:customerAddress,totalSpent:0,purchaseCount:0,status:'pending_approval',createdBy:currentUser.uid,createdByName:userData.fullName,createdAt:serverTimestamp()});customerId=custRef.id;}
        for(const item of items){
          // Only deduct stock for inventory items
          if (!item.isNonInventory && item.id) {
            const ref=doc(db,'stock_items',item.id);const snap=await getDoc(ref);
            if(snap.exists()){
              const cur=parseFloat(snap.data().quantityAvailable ?? snap.data().unitQty ?? 0);
              const threshold=parseFloat(snap.data().threshold||10);
              const newQty=cur-(item.deductQty||0);
              batch.update(ref,{unitQty:newQty,quantityAvailable:newQty,quantitySold:increment(item.deductQty),status:newQty<=0?'out_of_stock':newQty<=threshold?'low':'available',updatedAt:serverTimestamp()});
            }
          }
        }
        const saleRef=doc(collection(db,'sales'));batch.set(saleRef,{receiptNumber,customerId,customerName,customerPhone,customerAddress,items,totalAmount:total,paymentMethod:selectedPayment,attendantId:currentUser.uid,attendantName:userData.fullName,status:'completed',createdAt:serverTimestamp()});
        if(customerId&&customerType==='existing'){batch.update(doc(db,'customers',customerId),{totalSpent:increment(total),purchaseCount:increment(1),lastPurchase:serverTimestamp()});}
        await batch.commit();await logAudit('sale',`Sale ${receiptNumber}: ${formatCurrency(total)} to ${customerName}`);
        showToast(`Sale completed! #${receiptNumber}`,'success');
        showReceiptModal({id:saleRef.id,receiptNumber,customerName,customerPhone,customerAddress,items,totalAmount:total,paymentMethod:selectedPayment,attendantName:userData.fullName,createdAt:new Date()});hideModal();
      }catch(e){showToast('Failed: '+e.message,'error');}
    });
  };

  // ========== RETURN GOODS (unchanged) ==========
  window.openReturnModal = (saleId)=>{const sale=allSales.find(s=>s.id===saleId);if(!sale)return;let itemsHtml=sale.items.map((item,idx)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px;background:var(--gray-light);border-radius:10px;"><span style="flex:1;"><strong>${item.name}</strong>${item.sizeLabel?` <small>(${item.sizeLabel})</small>`:''}<br><small>Sold: ${item.quantity} x ${formatCurrency(item.unitPrice)}</small></span><input type="number" step="0.25" id="return-qty-${idx}" value="0" min="0" max="${item.quantity}" style="width:70px;padding:8px;border-radius:8px;border:1px solid #ddd;text-align:center;"><span style="font-size:0.8rem;color:var(--gray);">/ ${item.quantity}</span></div>`).join('');showModal('Return Goods',`<p><strong>Receipt:</strong> ${sale.receiptNumber} | <strong>Customer:</strong> ${sale.customerName}</p><p style="color:var(--gray);">Select quantity to return:</p>${itemsHtml}<div class="form-group"><label>Reason</label><textarea class="form-control" id="returnReason" rows="2"></textarea></div><p style="font-weight:600;">Return Action:</p><div class="return-options"><div class="return-option selected" data-action="refund" onclick="window._selectReturnAction('refund')"><i class="fas fa-money-bill-wave"></i><div><strong>Full Refund</strong><br><small>Return money to customer</small></div></div><div class="return-option" data-action="exchange_same" onclick="window._selectReturnAction('exchange_same')"><i class="fas fa-exchange-alt"></i><div><strong>Exchange Same Price</strong><br><small>Swap for another item</small></div></div><div class="return-option" data-action="exchange_higher" onclick="window._selectReturnAction('exchange_higher')"><i class="fas fa-level-up-alt"></i><div><strong>Exchange + Add Money</strong><br><small>Upgrade to higher price</small></div></div><div class="return-option" data-action="store_credit" onclick="window._selectReturnAction('store_credit')"><i class="fas fa-piggy-bank"></i><div><strong>Store Credit</strong><br><small>Keep for later</small></div></div></div><button class="btn btn-primary" onclick="window._processReturn('${saleId}')" style="width:100%;margin-top:15px;"><i class="fas fa-check"></i> Process Return</button>`);};
  window._selectReturnAction = (action)=>{selectedReturnAction=action;document.querySelectorAll('.return-option').forEach(o=>o.classList.remove('selected'));document.querySelector(`[data-action="${action}"]`)?.classList.add('selected');};
  window._processReturn = (saleId)=>{const sale=allSales.find(s=>s.id===saleId);if(!sale)return;const returnedItems=[];let totalRefund=0;sale.items.forEach((item,idx)=>{const q=parseFloat(document.getElementById(`return-qty-${idx}`)?.value)||0;if(q>0){returnedItems.push({...item,returnedQty:q,refundAmount:q*item.unitPrice});totalRefund+=q*item.unitPrice;}});if(returnedItems.length===0){showToast('Select quantity to return','error');return;}const reason=document.getElementById('returnReason')?.value?.trim()||'No reason';showPinModal('Process Return',`process return of ${formatCurrency(totalRefund)}`,async()=>{try{const batch=writeBatch(db);for(const item of returnedItems){if(item.id&&!item.isNonInventory){const ref=doc(db,'stock_items',item.id);const snap=await getDoc(ref);if(snap.exists()){const cur=parseFloat(snap.data().quantityAvailable??snap.data().unitQty??0);const threshold=parseFloat(snap.data().threshold||10);const addBackQty=item.returnedQty*(item.size==='pack'?(parseInt(snap.data().packSize)||12):item.size==='bundle'?(parseInt(snap.data().bundleSize)||50):parseFloat(item.size)||1);const newQty=cur+addBackQty;batch.update(ref,{unitQty:newQty,quantityAvailable:newQty,quantitySold:increment(-addBackQty),status:newQty<=0?'out_of_stock':newQty<=threshold?'low':'available',updatedAt:serverTimestamp()});}}}batch.set(doc(collection(db,'returns')),{saleId,saleReceiptNumber:sale.receiptNumber,customerId:sale.customerId,customerName:sale.customerName,returnedItems,totalRefund,returnAction:selectedReturnAction,reason,processedBy:currentUser.uid,processedByName:userData.fullName,createdAt:serverTimestamp()});const saleUpdate={status:'returned',returnedAt:serverTimestamp(),returnedBy:currentUser.uid,returnedByName:userData.fullName,returnAction:selectedReturnAction,totalRefund};if(selectedReturnAction==='exchange_same')saleUpdate.exchangeNote='Exchanged for same price item';else if(selectedReturnAction==='exchange_higher')saleUpdate.exchangeNote='Exchanged for higher price + additional payment';else if(selectedReturnAction==='store_credit')saleUpdate.exchangeNote='Store credit held for later';batch.update(doc(db,'sales',saleId),saleUpdate);if(sale.customerId&&selectedReturnAction==='refund'){batch.update(doc(db,'customers',sale.customerId),{totalSpent:increment(-totalRefund),purchaseCount:increment(-1)});}await batch.commit();await logAudit('return_goods',`Return ${formatCurrency(totalRefund)} | Receipt ${sale.receiptNumber} | Action: ${selectedReturnAction}`);const labels={refund:`Refunded: -${formatCurrency(totalRefund)}`,exchange_same:`Exchanged: ${formatCurrency(totalRefund)}`,exchange_higher:`Upgrade exchange: ${formatCurrency(totalRefund)}`,store_credit:`Store credit: ${formatCurrency(totalRefund)}`};showToast(labels[selectedReturnAction],'success');hideModal();}catch(e){showToast('Failed: '+e.message,'error');}});};

  // UPDATED RECEIPT MODAL & PRINT – clear font, bold only on header (unchanged)
  window.showReceiptModal = (sale)=>{
    const dateStr=sale.createdAt?new Date(sale.createdAt.toDate?sale.createdAt.toDate():sale.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    const timeStr=sale.createdAt?new Date(sale.createdAt.toDate?sale.createdAt.toDate():sale.createdAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const itemsHtml=sale.items.map(i=>`<div class="receipt-item"><span>${i.quantity}x ${i.name}${i.sizeLabel?` (${i.sizeLabel})`:''}</span><span>${formatCurrency(i.quantity*i.unitPrice)}</span></div>`).join('');
    showModal('Receipt',`
      <div class="receipt-container">
        <div class="receipt-header">
          <h2 style="font-weight:bold;">✨ OmoCreations ✨</h2>
          <p class="addr" style="font-weight:bold;">3 Oyebo Street, Abiola Way</p>
          <p class="addr" style="font-weight:bold;">Behind Laroy Suite, Abeokuta 111101</p>
          <p class="addr" style="font-weight:bold;">Ogun State, Nigeria</p>
          <p class="addr" style="font-weight:bold;">📞 0807 734 0294</p>
          <p class="rec" style="margin-top:6px;">#${sale.receiptNumber}</p>
          <p class="rec">${dateStr} ${timeStr}</p>
        </div>
        <p class="cust-info"><strong>Customer:</strong> ${sale.customerName}<br><strong>Served by:</strong> ${sale.attendantName}</p>
        <div class="receipt-items">${itemsHtml}</div>
        <div class="receipt-total"><span>Total:</span><span>${formatCurrency(sale.totalAmount)}</span></div>
        <p class="thanks">Thank you for your patronage!</p>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-primary" onclick="printReceipt('${sale.id}')" style="flex:1;"><i class="fas fa-print"></i> Print</button>
        <button class="btn btn-outline" onclick="hideModal()" style="flex:1;">Close</button>
      </div>
    `);
  };
  window.viewReceipt = (id)=>{const s=allSales.find(x=>x.id===id);if(s)showReceiptModal(s);};

  // UPDATED PRINT FUNCTION – same clean font, bold only on header (unchanged)
  window.printReceipt = (id) => {
    const s = allSales.find(x => x.id === id);
    if (!s) return;

    const dateStr = s.createdAt
      ? new Date(s.createdAt.toDate ? s.createdAt.toDate() : s.createdAt)
          .toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
      : new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
    const timeStr = s.createdAt
      ? new Date(s.createdAt.toDate ? s.createdAt.toDate() : s.createdAt)
          .toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
      : new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

    const receiptHTML = `
      <html>
        <head>
          <title>Receipt #${s.receiptNumber}</title>
          <style>
            @page { margin: 0; size: 80mm auto; }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
              font-weight: normal;
              padding: 3mm 4mm;
              max-width: 76mm;
              margin: 0 auto;
              font-size: 10pt;
              line-height: 1.3;
            }
            .h { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 3px; margin-bottom: 4px; }
            .h h2 { font-size: 12pt; margin: 0; font-weight: bold; }
            .h .addr { font-size: 8pt; margin: 0; line-height: 1.2; font-weight: bold; }
            .h .rec { font-size: 9pt; margin: 2px 0; font-weight: normal; }
            .cust { font-size: 9pt; margin: 4px 0; line-height: 1.3; font-weight: normal; }
            .items { margin: 4px 0; }
            .item { display: flex; justify-content: space-between; font-size: 9pt; margin: 1px 0; padding: 0; line-height: 1.3; font-weight: normal; }
            .item span:first-child { flex: 1; }
            .item span:last-child { text-align: right; min-width: 60px; white-space: nowrap; }
            .total { border-top: 1px dashed #000; padding-top: 3px; margin-top: 4px; font-weight: bold; font-size: 10pt; text-align: right; }
            .thanks { text-align: center; font-size: 9pt; margin-top: 5px; font-style: italic; font-weight: normal; }
          </style>
        </head>
        <body>
          <div class="h">
            <h2>✨ OmoCreations ✨</h2>
            <p class="addr">3 Oyebo Street, Abiola Way, Behind Laroy Suite</p>
            <p class="addr">Abeokuta 111101, Ogun State, Nigeria</p>
            <p class="addr">📞 0807 734 0294</p>
            <p class="rec">#${s.receiptNumber}</p>
            <p class="rec">${dateStr} ${timeStr}</p>
          </div>
          <p class="cust">Customer: ${s.customerName}<br>Served by: ${s.attendantName}</p>
          <div class="items">
            ${s.items.map(i => `
              <div class="item">
                <span>${i.quantity}x ${i.name}${i.sizeLabel ? ` (${i.sizeLabel})` : ''}</span>
                <span>${formatCurrency(i.quantity * i.unitPrice)}</span>
              </div>
            `).join('')}
          </div>
          <div class="total">Total: ${formatCurrency(s.totalAmount)}</div>
          <p class="thanks">Thank you for your patronage!</p>
        </body>
      </html>
    `;

    const oldFrame = document.getElementById('printIframe');
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement('iframe');
    iframe.id = 'printIframe';
    iframe.style.display = 'none';
    iframe.style.position = 'absolute';
    iframe.style.left = '-9999px';
    iframe.style.top = '-9999px';
    document.body.appendChild(iframe);

    iframe.contentWindow.document.open();
    iframe.contentWindow.document.write(receiptHTML);
    iframe.contentWindow.document.close();

    iframe.onload = () => {
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => iframe.remove(), 1000);
      }, 300);
    };

    setTimeout(() => {
      if (iframe.contentWindow.document.readyState === 'complete') {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => iframe.remove(), 1000);
      }
    }, 500);
  };

  window.exportSalesData = ()=>{const headers=['Receipt #','Date','Customer','Phone','Items','Total','Payment','Status'];const rows=allSales.map(s=>[s.receiptNumber||'',s.createdAt?.toDate().toLocaleString()||'',s.customerName||'',s.customerPhone||'',s.items?.length||0,s.totalAmount||0,s.paymentMethod||'',s.status||'completed']);const csv=[headers.join(','),...rows.map(r=>r.map(c=>`"${c}"`).join(','))].join('\n');const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`sales_${new Date().toISOString().split('T')[0]}.csv`;a.click();showToast('Exported','success');};
  window.refreshData = ()=>{loadSales();showToast('Refreshed','success');};

  document.getElementById('salesSearchInput').addEventListener('input',renderSales);

  onAuthStateChanged(auth,async(u)=>{if(!u){window.location.href='auth.html';return;}currentUser=u;try{const snap=await getDoc(doc(db,'users',u.uid));if(!snap.exists()||snap.data().status!=='active'){await signOut(auth);window.location.href='auth.html';return;}userData=snap.data();document.getElementById('userName').textContent=userData.fullName?.split(' ')[0]||'Staff';document.getElementById('userRole').textContent=userData.role?.replace('_',' ')||'Staff';document.getElementById('userAvatar').textContent=(userData.fullName||'A').charAt(0).toUpperCase();document.getElementById('currentDate').textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});buildSidebar();loadSales();if(isAdmin()){statsRevealed=true;updateStatsDisplay();}await logAudit('view_sales','Viewed sales');}catch(e){showToast('Error loading','error');}});
  window.addEventListener('beforeunload',cleanup);
</script>
</body>
</html>
